<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celeste 迷你播放器</title><link rel="stylesheet" href="mini-player.css"><script src="mini-player.js" defer></script><body><div class="glow a"></div><div class="glow b"></div><div class="glow c"></div><header><img id="cover" alt="专辑封面" hidden><div id="placeholder">CELESTE</div><div class="caption"><strong id="title">未在播放</strong><span id="artist">Celeste Music Player</span></div><nav><button data-cmd="minimize" title="最小化" aria-label="最小化" data-icon="minus"></button><button data-cmd="main" title="返回主程序" aria-label="返回主程序" data-icon="expand"></button><button data-cmd="close" title="关闭迷你播放器" aria-label="关闭迷你播放器" data-icon="close"></button></nav></header><main hidden><div id="lyrics" tabindex="0"></div><div id="queue" hidden></div></main><footer><div class="timeline"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><span id="duration">0:00</span></div><div class="controls"><button id="volume-button" title="音量" aria-label="音量" data-icon="volume"></button><button id="more-button" title="样式与置顶" aria-label="样式与置顶" data-icon="more"></button><button data-cmd="previous" title="上一首" aria-label="上一首" data-icon="previous"></button><button id="play" data-cmd="play" title="播放或暂停" aria-label="播放或暂停" data-icon="play"></button><button data-cmd="next" title="下一首" aria-label="下一首" data-icon="next"></button><button id="lyrics-button" title="展开歌词" aria-label="展开歌词" aria-pressed="false" data-icon="lyrics"></button><button id="queue-button" title="展开队列" aria-label="展开队列" aria-pressed="false" data-icon="queue"></button></div></footer><div id="volume-panel" class="popup" hidden><label>音量 <output id="volume-value">100%</output><input id="volume" type="range" min="0" max="100" value="100" aria-label="音量"></label></div><div id="more-panel" class="popup" hidden><button data-cmd="pin" id="pin">始终置顶</button><button data-cmd="settings">打开迷你播放器设置</button></div></body></html>
