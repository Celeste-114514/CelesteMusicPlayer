<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- 菜单只画自己，不加载主 shell / 曲库模块，也不接受任意 URL：
       宿主下发的是主题变量（同一套预设解析器的产物）和一组枚举动作 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Celeste · 托盘菜单</title>
  <link rel="stylesheet" href="tray-menu.css">
  <script src="tray-menu.js" defer></script>
</head>
<body>
  <div class="tray-menu" id="menu" role="menu" aria-label="Celeste 菜单"></div>
  <p class="tray-empty" id="empty" hidden>菜单尚未就绪</p>
</body>
</html>
