  /* ---------- 页头 / 播放条 ---------- */
  /* 评分胶囊行（原生 RatingFilterPanel 口径：未评分 + ★1..★5；
     默认 -1=全部已评分，此时没有一个胶囊选中——原生也是这样） */
  var RATING_CAPS = [
    { v: 0, t: '未评分' },
    { v: 1, t: '★1' }, { v: 2, t: '★2' }, { v: 3, t: '★3' },
    { v: 4, t: '★4' }, { v: 5, t: '★5' }
  ];
  function ratingFilterText(){
    if (S.ratingFilter === 0) return '未评分';
    if (S.ratingFilter > 0) return S.ratingFilter + ' 星';
    return '全部已评分';
  }
  function renderRatingBar(){
    var html = '';
    for (var i = 0; i < RATING_CAPS.length; i++){
      var c = RATING_CAPS[i];
      html += '<button class="caps' + (S.ratingFilter === c.v ? ' on' : '') + '" data-v="' + c.v + '">'
           +  esc(c.t) + '</button>';
    }
    $('ratingbar').innerHTML = html;
    var els = $('ratingbar').querySelectorAll('.caps');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){
        var v = +this.getAttribute('data-v');
        if (S.ratingFilter === v) return;   // 已选中，不重复推
        S.ratingFilter = v;
        renderRatingBar();
        paintHeader();
        post({kind:'rating', value:v});     // C# 按星级重推列表
      };
    }
  }
  function paintHeader(){
    if (S.artist){
      // 艺术家详情：名字 + 首数 · 总时长（大头像在左栏 #artmeta）
      $('pgTitle').textContent = S.artist.name || '艺术家';
      var asub = [];
      asub.push(S.artistTracks.length + ' 首');
      if (S.artist.dur) asub.push(S.artist.dur);
      $('pgSub').textContent = asub.join(' · ');
      return;
    }
    if (S.album){
      // 专辑详情：专辑名 + 艺术家 · 年份 · 首数 · 总时长（大封面在左栏 #albmeta）
      $('pgTitle').textContent = S.album.name || '专辑';
      var sub = [];
      if (S.album.artist) sub.push(S.album.artist);
      if (S.album.year) sub.push(S.album.year);
      sub.push(S.albumTracks.length + ' 首');
      if (S.album.dur) sub.push(S.album.dur);
      $('pgSub').textContent = sub.join(' · ');
      return;
    }
    if (S.page === 'Albums'){
      $('pgTitle').textContent = '专辑';
      $('pgSub').textContent = S.albums.length
        ? (S.albums.length + ' 张专辑' + ($('q').value ? ' · 筛选出 ' + S.albumView.length + ' 张' : ''))
        : '加载中…';
      return;
    }
    if (S.page === 'Artists' || S.page === 'AlbumArtists'){
      $('pgTitle').textContent = (S.page === 'AlbumArtists') ? '专辑艺术家' : '艺术家';
      $('pgSub').textContent = S.artists.length
        ? (S.artists.length + ' 位' + ($('q').value ? ' · 筛选出 ' + S.artistView.length + ' 位' : ''))
        : '加载中…';
      return;
    }
    if (S.page === 'TagSort'){
      // 标签排序：墙显示当前字段 + 分类数；面板显示标题 + 当前视角的内容数
      var t2 = S.tagsort;
      if (t2.mode === 'Wall'){
        var fl = '';
        for (var fi = 0; fi < t2.fields.length; fi++) if (t2.fields[fi].on) fl = t2.fields[fi].label;
        $('pgTitle').textContent = '标签排序';
        // 分类卡到了就报分类数；一条都没推来过且总数为 0 = 空曲库（照墙上的空态文案）
        $('pgSub').textContent = t2.cards.length
          ? ((fl ? '按「' + fl + '」分类 · ' : '') + t2.total + ' 个分类')
          : (t2.total > 0 ? '加载中…' : '曲库里还没有歌曲');
        return;
      }
      $('pgTitle').textContent = t2.title || '标签排序';
      var tsub = '';
      if (t2.mode === 'Songs') tsub = t2.songs.length + ' 首';
      else if (t2.mode === 'Albums') tsub = t2.grid.length + ' 张专辑';
      else if (t2.mode === 'Artists') tsub = t2.grid.length + ' 位艺术家';
      else if (t2.mode === 'GroupBy'){
        var gn = 0;
        var rows2 = (t2.group && t2.group.rows) || [];
        for (var gi = 0; gi < rows2.length; gi++) if (!rows2[gi].h) gn++;
        tsub = gn + ' 首';
      }
      $('pgSub').textContent = tsub;
      return;
    }
    if (S.page === 'Folders'){
      // 媒体库：根目录数 + 当前选中文件夹名（完整路径在右栏台头，原生 MediaDetailsHeader 口径）
      $('pgTitle').textContent = '媒体库';
      var f = S.folder;
      if (!f.roots.length) $('pgSub').textContent = '未配置媒体库文件夹';
      else $('pgSub').textContent = f.roots.length + ' 个目录'
        + (f.songsPath ? ' · ' + folderBaseName(f.songsPath) : '');
      return;
    }
    // 列表面板（歌曲 + 五个面板）：同一套副标题逻辑，评分面板多带当前星级
    var meta = LIST_META[S.page];
    if (!meta) return;   // 占位页不动页头（同旧版行为）
    $('pgTitle').textContent = meta.title;
    var sub2;
    if (S.songs.length && S.total > S.songs.length)
      sub2 = '加载中… ' + S.songs.length + ' / ' + S.total;
    else if (S.songs.length)
      sub2 = S.songs.length + ' 首' + ($('q').value ? ' · 筛选出 ' + S.view.length + ' 首' : '');
    else if (S.total > 0)
      sub2 = '加载中… 0 / ' + S.total;
    else
      sub2 = '加载中…';
    if (S.page === 'Ratings') sub2 += ' · ' + ratingFilterText();
    $('pgSub').textContent = sub2;
  }
  function paintPlaybar(){
    // 开着详情时 S.cur 是详情内下标，得换一张表取，不然播放条显示错人
    var list = S.album ? S.albumTracks : (S.artist ? S.artistTracks : S.songs);
    var t = (S.cur >= 0 && list[S.cur]) ? list[S.cur] : S.ext;
    $('pbTitle').textContent = t ? t.title : '未在播放';
    $('pbSub').textContent = t ? ((t.artist || '') + (t.album ? ' · ' + t.album : '')) : '';
    $('npTag').textContent = t ? (t.title + ' — ' + (t.artist || '')) : '未在播放';
    $('btnPlay').innerHTML = S.playing ? '&#10073;&#10073;' : '&#9654;';
    $('tmCur').textContent = mmss(S.pos);
    $('tmDur').textContent = mmss(S.dur);
    var p = S.dur > 0 ? Math.min(1, S.pos / S.dur) : 0;
    $('trackFill').style.width = (p * 100) + '%';
    $('trackKnob').style.left = (p * 100) + '%';
    $('volFill').style.width = (S.vol * 100) + '%';
    $('volKnob').style.left = (S.vol * 100) + '%';
  }

  /* ---------- 占位页（未做的分类） ----------
     ⚠ 不能再像旧版那样直接改 #view 的 innerHTML——那会把 #rows/#albgrid 一起删掉，
     之后点"先去逛歌曲"回列表时 $('rows') 已经是 null，直接 TypeError。
     现在占位页是 #view 里的一个独立容器，和正式视图一样只切显隐。 */
  function renderPlaceholder(cat){
    var t = (cat && cat.t) || S.page;
    resetDetail();
    hideAllViews();
    setSearchVisible(true);
    $('btnPlayAll').style.visibility = 'hidden';
    $('pgTitle').textContent = t;
    $('pgSub').textContent = '';
    var ph = $('placeholder');
    ph.innerHTML = '<div class="empty">'
      + '<div class="big">「' + esc(t) + '」面板还没做</div>'
      + '侧栏分类都留着，做一个补一个。<br>'
      + '<button class="btn" id="btnBackSongs" style="margin-top:14px">先去逛歌曲</button></div>';
    ph.style.display = '';
    $('btnBackSongs').onclick = function(){ post({kind:'nav', id:'Songs'}); };
  }

  /* ---------- 交互（全部只上报意图） ---------- */
  $('rows').addEventListener('click', function(e){
    var fav = e.target.closest('[data-fav]');
    if (fav){
      var si = +fav.getAttribute('data-fav');
      S.love[si] = !S.love[si];
      fav.className = 'fav' + (S.love[si] ? ' on' : '');
      fav.innerHTML = S.love[si] ? '&#10084;' : '&#9825;';
      post({kind:'love', index:si, on:S.love[si]});
      return;
    }
    var row = e.target.closest('.row');
    if (row) post({kind:'play', index:+row.getAttribute('data-s')});
  });
  $('btnPlayAll').addEventListener('click', function(){ post({kind:'play', index:0}); });
  $('btnPlay').addEventListener('click', function(){ post(S.playing ? {kind:'pause'} : {kind:'resume'}); });
  $('btnPrev').addEventListener('click', function(){ post({kind:'prev'}); });
  $('btnNext').addEventListener('click', function(){ post({kind:'next'}); });
  $('btnExit').addEventListener('click', function(){ post({kind:'exit'}); });
  $('track').addEventListener('click', function(e){
    var r = $('track').getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    post({kind:'seek', position: p * (S.dur || 0)});
  });
  $('vol').addEventListener('click', function(e){
    var r = $('vol').getBoundingClientRect();
    var v = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    S.vol = v; paintPlaybar();
    post({kind:'volume', value:v});
  });
  var qTimer = null;
  $('q').addEventListener('input', function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){
      if (inDetail()) return;            // 详情页不参与筛选
      if (S.page === 'Albums'){ renderAlbGrid(); paintHeader(); }
      else if (S.page === 'Artists' || S.page === 'AlbumArtists'){ renderArtWall(); paintHeader(); }
      else if (S.page === 'Folders'){ renderFolderDetail(); }   // 媒体库：只筛右栏文件名
      else if (LIST_META[S.page]){ renderRows(); paintHeader(); }
    }, 120);
  });
  /* 详情左上角的返回：专辑详情回专辑网格，艺术家详情回艺术家墙。
     专辑艺术家页也归"回艺术家墙"——墙和详情用的是同一个列表（AlbumArtists 分组）。 */
  $('btnBackGrid').addEventListener('click', function(){
    if (S.artist) post({kind:'artistback'});
    else post({kind:'nav', id:'Albums'});
  });

  /* ---------- 收 C# 的消息 ---------- */
  whenWv(function(){
    window.chrome.webview.addEventListener('message', function(e){
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (!m || !m.kind) return;
      switch (m.kind){
        case 'data':
          if (m.categories) { S.cats = m.categories; renderNav(); }
          if (typeof m.total === 'number') S.total = m.total;
          if (typeof m.cur === 'number') S.cur = m.cur;
          if (m.songs && m.songs.length){
            // 带歌曲的 data = 全量快照（首包之后不会再走这里）
            S.songs = m.songs;
            S.love = {};
            // 正在专辑网格/详情里就不动歌曲列表（自检探针补推时会把视图冲掉）
            if (isListPage()) renderRows();
          } else {
            // 首包：只有分类和总数，歌曲等 data/append 一块块来
            S.songs = [];
            S.love = {};
            S.shown = 0;
            if (isListPage()) $('rows').innerHTML = '';
          }
          paintHeader();
          break;
        case 'data/append':
          if (m.songs && m.songs.length){
            S.songs = S.songs.concat(m.songs);
            // 同上：专辑详情里 #rows 存的是专辑曲目，不能把歌曲行追加进去
            if (isListPage()) appendRows();
            paintHeader();
          }
          break;
        case 'albums':
          // 专辑网格数据（封面先空着，albumcovers 按批补）
          S.albums = m.items || [];
          if (S.page === 'Albums' && !inDetail()) renderAlbGrid();
          paintHeader();
          break;
        case 'albumcovers':
          // C# 后台预热算好的专辑封面：按专辑下标更新专辑网格卡片，
          // 同时按专辑名回填该专辑下所有歌曲行的封面（歌曲快照不带封面）
          if (m.items){
            for (var k = 0; k < m.items.length; k++){
              var it = m.items[k];
              var a = S.albums[it.i];
              if (a) a.cover = it.cover || '';
              var card = $('albgrid').querySelector('.acard[data-a="' + it.i + '"] .cv');
              if (card && a && a.cover)
                card.innerHTML = '<img src="' + a.cover + '" alt="" onerror="postCoverErr(this.src)">';
              if (it.album && it.cover) fillSongCovers(it.album, it.cover);
            }
          }
          break;
        case 'albumtracks':
          // 点了一张专辑：切到详情视图（play/love 的 index 从此按这份曲目）
          // 两类详情互斥（从艺术家详情点专辑卡进来时，先摘掉艺术家上下文，
          // 不然 paintHeader 还按艺术家显示页头）
          S.artist = null; S.artistAlbums = []; S.artistTracks = [];
          S.album = m.album || null;
          S.albumTracks = m.tracks || [];
          S.cur = (typeof m.cur === 'number') ? m.cur : -1;
          S.love = {};
          showAlbumDetail();
          break;
        case 'artists':
          // 艺术家墙（Artists / AlbumArtists 两个分类共用，mode 区分）
          S.artists = m.items || [];
          if ((S.page === 'Artists' || S.page === 'AlbumArtists') && !inDetail()) renderArtWall();
          paintHeader();
          break;
        case 'artistcovers':
          // 艺术家头像按批补。两种来货：预热批带 i（按下标更新卡片）；
          // 网络头像下载完成只带 name（按名字匹配，防墙重推后下标张冠李戴）。
          // 只更卡片，别动正在播的高亮。
          if (m.items){
            for (var kc = 0; kc < m.items.length; kc++){
              var ic = m.items[kc];
              if (typeof ic.i === 'number'){
                var ar = S.artists[ic.i];
                if (ar) ar.cover = ic.cover || '';
                var acard = $('artgrid').querySelector('.acard[data-x="' + ic.i + '"] .av');
                if (acard && ar && ar.cover)
                  acard.innerHTML = '<img src="' + ar.cover + '" alt="" onerror="postCoverErr(this.src)">';
              } else if (ic.name){
                // 只带名字：遍历墙找同名艺术家（AlbumArtists/Artists 两套分组名字可能重复，
                // 两个都更新无妨——封面口径一致）
                for (var ai = 0; ai < S.artists.length; ai++){
                  var a2 = S.artists[ai];
                  if (!a2 || a2.name !== ic.name) continue;
                  a2.cover = ic.cover || '';
                  var c2 = $('artgrid').querySelector('.acard[data-x="' + a2.i + '"] .av');
                  if (c2 && a2.cover)
                    c2.innerHTML = '<img src="' + a2.cover + '" alt="" onerror="postCoverErr(this.src)">';
                }
              }
              // 正在看的艺术家详情：同名就把左栏大头像也换掉（网络头像优先）
              if (ic.name && S.artist && S.artist.name === ic.name && ic.cover){
                S.artist.cover = ic.cover;
                var big = $('artmeta').querySelector('.bigcov');
                if (big) big.innerHTML = '<img src="' + ic.cover + '" alt="" onerror="postCoverErr(this.src)">';
              }
            }
          }
          break;
        case 'artistavatar':
          // 网络头像下载完成：只更新正在看的艺术家详情左栏大头像
          if (m.cover && S.artist){
            S.artist.cover = m.cover;
            var bigc = $('artmeta').querySelector('.bigcov');
            if (bigc) bigc.innerHTML = '<img src="' + m.cover + '" alt="" onerror="postCoverErr(this.src)">';
          }
          break;
        case 'artistdetail':
          // 点了一位艺术家：切到详情（专辑段 + 曲目段；play/love 的 index 按曲目）
          // 与专辑详情互斥（从专辑详情返回艺术家墙再点人时不会带着专辑上下文）
          S.album = null; S.albumTracks = [];
          S.artist = m.artist || null;
          S.artistAlbums = m.albums || [];
          S.artistTracks = m.tracks || [];
          S.cur = (typeof m.cur === 'number') ? m.cur : -1;
          S.love = {};
          showArtistDetail();
          break;
        case 'nav':
          S.page = m.id;
          if (m.id === 'Ratings') S.ratingFilter = -1;   // 进评分页重置回「全部已评分」（原生默认）
          var cat = null;
          for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === m.id) cat = S.cats[i];
          renderNav();
          if (m.ok !== false && LIST_META[m.id]){
            // 列表面板（歌曲 + 我喜欢的音乐/评分/最近播放/播放队列/播放最多）：
            // 数据由随后的 data/data/append 推来，这里先切视图
            showList();
          } else if (m.id === 'Albums' && m.ok !== false){
            showAlbumGrid();
          } else if ((m.id === 'Artists' || m.id === 'AlbumArtists') && m.ok !== false){
            showArtistWall();
          } else if (m.id === 'Folders' && m.ok !== false){
            // 媒体库：先切视图，根目录由随后的 folderroots 推来
            showFolder();
          } else if (m.id === 'TagSort' && m.ok !== false){
            // 标签排序：先切视图（墙/面板按 S.tagsort.mode），数据由随后的
            // tagsortcats / tagsortpanel 推来
            showTagSort();
          } else {
            renderPlaceholder(cat);
          }
          break;
        case 'folderroots':
          // 媒体库根目录（原生 RefreshFolderBrowserRoots 口径：根行显示完整路径）
          S.folder.roots = (m.roots || []).map(function(r){
            return {name:r.name, path:r.path, isFolder:r.isFolder !== false,
                    depth:0, kids:[], open:false, sel:false};
          });
          S.folder.songsPath = '';
          S.folder.songs = [];
          S.folder.loading = false;
          if (S.page === 'Folders'){ renderFolderTree(); renderFolderDetail(); paintHeader(); }
          break;
        case 'folderchildren':
          // 展开一层的子项到了：挂到对应节点的 kids 下并重渲（open 点击时已置好，
          // 这里不碰——防止「点了折叠又立刻点展开」时旧响应把树重新展开）
          if (m.items){
            var fn = folderFind(S.folder.roots, m.path);
            if (fn){
              fn.kids = m.items.map(function(c){
                return {name:c.name, path:c.path, isFolder:c.isFolder === true,
                        depth:fn.depth + 1, kids:[], open:false, sel:false};
              });
            }
          }
          if (S.page === 'Folders') renderFolderTree();
          break;
        case 'foldersongs':
          // 右栏歌曲（后台枚举+读标签完推来）；只认当前选中的文件夹，防过期响应盖版面
          if (m.path === S.folder.songsPath){
            S.folder.songs = m.songs || [];
            S.folder.loading = false;
            if (S.page === 'Folders'){ renderFolderDetail(); paintHeader(); }
          }
          break;
        case 'tagsortcats':
          // 标签排序分类墙：字段钮 + 分类卡 + total/shown/advice（切字段/返回/加载更多都走它）
          S.tagsort.mode = 'Wall';
          S.tagsort.fields = m.fields || [];
          S.tagsort.cards = (m.cards || []).map(function(c){
            return {name:c.name, n:c.n, cover:''};
          });
          S.tagsort.total = m.total || 0;
          S.tagsort.shown = m.shown || 0;
          S.tagsort.advice = m.advice || '';
          if (S.page === 'TagSort'){ renderTagSortWall(); paintHeader(); }
          break;
        case 'tagsortpanel':
          // 钻取面板（mode/title/fields + 当前视角那一段）。不在标签排序页就只存状态
          S.tagsort.mode = m.mode || 'Songs';
          S.tagsort.title = m.title || '';
          if (m.fields) S.tagsort.fields = m.fields;
          S.tagsort.cols = m.cols || [];
          S.tagsort.songs = m.songs || [];
          S.tagsort.grid = (m.grid || []).map(function(c){
            return {name:c.name, n:c.n, sub:c.sub, cover:''};
          });
          S.tagsort.sort = m.sort || null;
          S.tagsort.group = m.group || null;
          if (S.page === 'TagSort'){ renderTagSortPanel(); paintHeader(); }
          break;
        case 'tagsortcovers':
          // 卡片封面按批补：ctx=wall 补分类墙、grid 补面板专辑/艺术家卡（按下标）
          if (m.items){
            var tsc = (m.ctx === 'grid') ? $('tscards') : $('tsgrid');
            for (var ti = 0; ti < m.items.length; ti++){
              var tsi = m.items[ti];
              var tlist = (m.ctx === 'grid') ? S.tagsort.grid : S.tagsort.cards;
              var tc = tlist[tsi.i];
              if (tc) tc.cover = tsi.cover || '';
              var card = tsc.querySelector('.acard[data-i="' + tsi.i + '"] .cv');
              if (card && tc && tc.cover)
                card.innerHTML = '<img src="' + tc.cover + '" alt="" onerror="postCoverErr(this.src)">';
            }
          }
          break;
        case 'chips':
          // C# 后台预热算好的格式胶囊：按歌曲下标更新（行已渲染就改 DOM，没渲染就存着等渲染）
          if (m.items){
            for (var k = 0; k < m.items.length; k++){
              var it = m.items[k];
              var t = S.songs[it.i];
              if (!t) continue;
              t.chips = it.c || [];
              // 详情里 #rows 不是歌曲行：下标会撞，只存数据不动 DOM（回列表自然带上）
              if (inDetail()) continue;
              var row = $('rows').querySelector('.row[data-s="' + it.i + '"]');
              if (row){
                var html = chipsHtml(t);
                var box = row.querySelector('.chips');
                if (html){
                  if (box) box.innerHTML = html;
                  else {
                    box = document.createElement('div');
                    box.className = 'chips';
                    box.innerHTML = html;
                    var cell = row.querySelector('.m');
                    if (cell) cell.appendChild(box);
                  }
                } else if (box) { box.innerHTML = ''; }
              }
            }
          }
          break;
        case 'now':
          // 无条件 markPlaying：data 首包会预设 S.cur，分块推完时 now 带来的 index
          // 可能和预设值相同——用 !== 判断就永远不高亮正在播的那行
          if (typeof m.index === 'number') S.cur = m.index;
          S.playing = !!m.playing;
          if (typeof m.position === 'number') S.pos = m.position;
          if (typeof m.duration === 'number') S.dur = m.duration;
          if (typeof m.volume === 'number') S.vol = m.volume;
          if (m.cover) $('pbCov').innerHTML = '<img src="' + m.cover + '" alt="" onerror="postCoverErr(this.src)">';
          // 换曲时 C# 带来的曲目信息：正在播的曲子不在当前列表里时，播放条靠它显示
          if (m.track) S.ext = m.track;
          // 收藏态只动正在播那一行，不整表重画（这条消息每秒来）
          if (typeof m.love === 'boolean' && S.cur >= 0 && S.love[S.cur] !== m.love){
            S.love[S.cur] = m.love;
            var fb = $('rows').querySelector('.row[data-s="' + S.cur + '"] .fav');
            if (fb){
              fb.className = 'fav' + (m.love ? ' on' : '');
              fb.innerHTML = m.love ? '&#10084;' : '&#9825;';
            }
          }
          markPlaying();
          markTsPlaying();
          paintPlaybar();
          break;
        case 'theme':
          if (m.css) applyTheme(m.css);
          document.documentElement.className = m.dark ? 'dark' : '';
          break;
      }
    });
  });

  /* ---------- 就绪 ---------- */
  renderNav();
  paintPlaybar();
  post({kind:'ready'});
  /* ready 补发：头一条可能在宿主对象刚注入、消息通道还没接稳时被丢（重复无害，幂等） */
  var readyN = 0;
  var readyTimer = setInterval(function(){
    if (++readyN > 4){ clearInterval(readyTimer); return; }
    post({kind:'ready'});
  }, 700);
})();
</script>
</body>
</html>
