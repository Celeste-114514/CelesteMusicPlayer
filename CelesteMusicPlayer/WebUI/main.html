<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celeste · 歌曲浏览</title>
<style>
/* 颜色读 Celeste 令牌（--celeste-*），第二栏是 Apple 风格兜底值——主题没注入时界面依然完整。
   尺寸全部按设计稿量：窗口 1592×906、顶栏 44、侧栏 228、页头 98、行高 62、播放条 90。 */
:root{
  --bg:      var(--celeste-app-background,      #C9C9CE);
  --win:     var(--celeste-card-background,     #FFFFFF);
  --sb:      var(--celeste-panel-background,    #F5F5F8);
  --tb:      var(--celeste-panel-background,    #F1F1F6);
  --div:     var(--celeste-divider,             #EFEFF2);
  --div2:    var(--celeste-card-stroke,         #E5E5EA);
  --text:    var(--celeste-text-primary,        #1C1C1F);
  --text2:   var(--celeste-text-secondary,      #6E6E73);
  --text3:   var(--celeste-text-disabled,       #86868B);
  --card:    var(--celeste-overlay-background,  #FFFFFF);
  --hover:   var(--celeste-card-background-hover,#F4F4F7);
  --pill:    var(--celeste-input-background,    #E7E7EC);
  --pillbr:  var(--celeste-input-stroke,        #D6D6DC);
  --accent:  var(--celeste-accent-solid,        #FA243C);
  --accentx:  var(--celeste-accent-text,         #FFFFFF);
  --sel:     var(--celeste-selection-background,#FDECF0);
  --r-win:   10px;
  --r-card:  var(--celeste-radius-cover, 6px);
  --r-ctrl:  var(--celeste-radius-control, 15px);
  --r-nav:   var(--celeste-radius-medium, 8px);
  --rowh:   62px;
  --sbw:    228px;
  --font: var(--celeste-font-family-ui, -apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif);
  --mono: var(--celeste-font-family-mono, ui-monospace,Consolas,monospace);
}
html.dark{
  --bg:#0F0F10; --win:#1E1E1E; --sb:#191919; --tb:#232323; --div:#2E2E2E; --div2:#343434;
  --text:#F5F5F7; --text2:#98989D; --text3:#8E8E93; --card:#252525;
  --accent:#FF3B4E; --sel:#3A2028; --hover:#2C2C2C; --pill:#2E2E2E; --pillbr:#3A3A3A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.win{position:fixed;inset:0;background:var(--win);display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶栏 ---------- */
.tb{height:44px;flex:0 0 44px;background:var(--tb);border-bottom:1px solid var(--div2);
    display:flex;align-items:center;padding:0 14px;gap:12px}
.back{height:26px;border:1px solid var(--pillbr);background:transparent;border-radius:var(--r-ctrl);
      color:var(--text);font-family:var(--font);font-size:12.5px;padding:0 12px 0 8px;cursor:pointer;
      display:inline-flex;align-items:center;gap:4px}
.back:hover{background:var(--hover)}
.tbmid{font-size:12px;color:var(--text3);letter-spacing:.02em}
.search{height:26px;flex:0 0 240px;background:var(--pill);border:1px solid var(--pillbr);
        border-radius:13px;display:flex;align-items:center;gap:6px;padding:0 10px}
.search svg{opacity:.5;flex:0 0 13px}
.search input{border:0;background:transparent;outline:0;font-family:var(--font);font-size:12.5px;
              color:var(--text);width:100%}
.search input::placeholder{color:var(--text3)}
.spacer{flex:1}
.npTag{font-size:12px;color:var(--text2);max-width:280px;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}

/* ---------- 主体 ---------- */
.body{flex:1;display:flex;min-height:0}
.sb{width:var(--sbw);flex:0 0 var(--sbw);background:var(--sb);padding:10px 10px 0;
    overflow-y:auto;display:flex;flex-direction:column}
.sbgrp{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;padding:12px 8px 5px}
.nav{height:32px;border-radius:var(--r-nav);display:flex;align-items:center;gap:9px;
     padding:0 9px;cursor:pointer;color:var(--text);font-size:13px;margin-bottom:1px;user-select:none}
.nav svg{opacity:.72;flex:0 0 16px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--accent);font-weight:600}
.nav.on svg{opacity:1}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.nav.on .cnt{color:var(--accent);opacity:.75}
.nav .soon{margin-left:auto;font-size:10px;color:var(--text3);opacity:.8}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
.hdr{height:98px;flex:0 0 98px;padding:0 28px;display:flex;align-items:center;gap:16px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.hdr .sub{font-size:13px;color:var(--text2);margin-top:5px}
.btn{height:30px;border-radius:var(--r-ctrl);border:1px solid var(--div2);background:transparent;
     color:var(--text);font-family:var(--font);font-size:12.5px;padding:0 14px;cursor:pointer;
     display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accentx);font-weight:600}
.btn.pri:hover{filter:brightness(.94)}
.view{flex:1;overflow-y:auto;padding:0 28px 20px}

/* ---------- 曲目行 ---------- */
.thead{display:flex;height:26px;font-size:11px;color:var(--text3);letter-spacing:.04em;
       border-bottom:1px solid var(--div);margin-bottom:4px;align-items:center;position:sticky;top:0;
       background:var(--win);z-index:2}
.thead .n{width:34px;flex:0 0 34px;text-align:right;padding-right:12px}
.thead .m{flex:1;padding:0 14px}
.thead .d{width:52px;flex:0 0 52px;text-align:right}
.thead .fav{width:34px;flex:0 0 34px}
.row{display:flex;align-items:center;height:var(--rowh);border-bottom:1px solid var(--div);
     cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.on:hover{background:var(--sel);filter:brightness(.985)}
.row .n{width:34px;flex:0 0 34px;font-size:13px;color:var(--text3);text-align:right;
        padding-right:12px;font-variant-numeric:tabular-nums}
.row.on .n{color:var(--accent);font-size:14px}
.row .a{width:46px;height:46px;flex:0 0 46px;border-radius:var(--r-card);overflow:hidden;
        background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
        color:#fff;font-size:17px;font-weight:600}
.row .a img{width:100%;height:100%;object-fit:cover;display:block}
.row .m{flex:1;min-width:0;padding:0 14px}
.row .t{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
.row.on .t{color:var(--accent)}
.row .s{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;margin-top:2px}
.chips{display:flex;gap:5px;margin-top:4px}
.chip{font-size:10.5px;color:var(--text2);background:var(--pill);border:1px solid var(--pillbr);
      border-radius:4px;padding:1px 5px;letter-spacing:.02em}
.chip.hi{color:var(--accent);background:var(--sel);border-color:transparent}
.row .d{width:52px;flex:0 0 52px;font-size:12.5px;color:var(--text3);text-align:right;
        font-variant-numeric:tabular-nums}
.row .fav{width:34px;flex:0 0 34px;display:grid;place-items:center;color:var(--text3);
          opacity:0;background:transparent;border:0;cursor:pointer;font-family:var(--font);padding:0}
.row:hover .fav{opacity:1}
.row .fav.on{opacity:1;color:var(--accent)}
.empty{text-align:center;color:var(--text3);padding:70px 0;font-size:13px;line-height:2}
.empty .big{font-size:15px;color:var(--text2);font-weight:600}

/* ---------- 专辑网格 / 专辑详情 ---------- */
.backgrid{height:30px;border-radius:var(--r-ctrl);border:1px solid var(--div2);background:transparent;
          color:var(--text);font-family:var(--font);font-size:12.5px;padding:0 14px 0 8px;cursor:pointer;
          display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
.backgrid:hover{background:var(--hover)}
/* 专辑网格：minmax(150px) 而不是 170/178 —— 用户实测"封面太大"，
   150px 一行能排8 张，接近 Apple Music 专辑页的密度。 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px;padding:6px 0 24px}
.acard{cursor:pointer;min-width:0}
.acard .cv{width:100%;aspect-ratio:1;border-radius:var(--r-card);overflow:hidden;
          background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
          color:#fff;font-size:28px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.acard .cv img{width:100%;height:100%;object-fit:cover;display:block}
.acard .nm{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ar{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard:hover .nm{color:var(--accent)}

/* ---------- 艺术家墙 / 艺术家详情 ---------- */
/* 艺术家卡用圆形头像（原生 ArtistGridView 口径），跟方形专辑卡区分开 */
.grid-art{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 16px}
.acard.art{text-align:center}
.acard.art .av{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
                background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
                color:#fff;font-size:34px;font-weight:600}
.acard.art .av img{width:100%;height:100%;object-fit:cover;display:block}
.acard.art .nm{margin-top:10px;font-size:12.5px;text-align:center}
.acard.art .ct{font-size:11px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums}
/* 详情里两段的小标题 */
.sechead{font-size:15px;font-weight:600;margin:22px 0 10px;letter-spacing:-.01em}
.sechead .c{font-size:12px;color:var(--text2);font-weight:400;margin-left:8px}

/* ---------- 详情页分栏（布局照原生：专辑详情=左栏信息+右栏曲目；
   艺术家详情=左栏头像+中栏歌曲+右栏专辑） ---------- */
.view.cols{display:flex;gap:24px;align-items:flex-start}
.view.cols > div{min-width:0}
.dmeta{flex:0 0 300px;width:300px}
.dmeta .bigcov{width:100%;max-width:232px;aspect-ratio:1;border-radius:var(--r-card);overflow:hidden;
               background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
               color:#fff;font-size:64px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dmeta .bigcov img{width:100%;height:100%;object-fit:cover;display:block}
.dmeta .bigcov.round{border-radius:50%}
.dmeta .tech{font-size:12px;color:var(--text2);margin-top:14px;line-height:1.7}
.dmeta .dsdhint{font-size:11.5px;color:var(--text2);margin-top:12px;line-height:1.6;
                background:var(--pill);border:1px solid var(--pillbr);border-radius:8px;padding:8px 10px}
.dmeta .acts{margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#artmeta{flex:0 0 240px;width:240px}
#artmeta .bigcov{width:100%;max-width:160px;aspect-ratio:1;border-radius:50%;overflow:hidden;
                 background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
                 color:#fff;font-size:44px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#artmeta .bigcov img{width:100%;height:100%;object-fit:cover;display:block}
#artmeta .acts{margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#listwrap{flex:1;min-width:0}
.view.cols #listwrap.art{flex:0 0 430px;width:430px}
#xtalbwrap{flex:1;min-width:0}
/* 艺术家详情的专辑段：卡片 132px（原生 ArtistAlbumGridView 口径） */
#xtalbwrap .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 12px}
/* 详情里曲目表首列是「音轨号」（原生 56px 列宽），比列表面板的 # 宽一档 */
.view.cols .thead .n{width:52px;flex:0 0 52px}
.view.cols .row .n{width:52px;flex:0 0 52px}

/* ---------- 媒体库（布局照原生 FolderBrowserView：左文件夹树 + 右栏歌曲） ---------- */
#folderwrap{display:flex;gap:20px;align-items:flex-start;min-height:0}
#foldertree{flex:0 0 320px;width:320px;min-width:0}
#folderdetail{flex:1;min-width:0}
/* 左栏树行：原生 MinHeight 36 / 圆角 8；根行是半透明胶囊（原生 CapsuleBackground） */
.fnode{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 8px;border-radius:8px;
       font-size:13px;cursor:default;user-select:none}
.fnode:hover{background:var(--hover)}
.fnode.sel{background:var(--sel)}
.fnode.root{background:rgba(120,120,128,.14);font-weight:500}
.fnode.root.sel{background:var(--sel)}
.fnode .chev{flex:0 0 14px;text-align:center;opacity:.5;font-size:10px;line-height:1}
.fnode .ic{flex:0 0 16px;height:16px;opacity:.55;display:grid;place-items:center}
.fnode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 右栏：台头（完整路径）+ 歌曲行（原生 MediaDetailsList：序号/文件名/艺术家·专辑/时长，40px） */
.fhead{font-size:13px;font-weight:600;padding:6px 4px 10px;border-bottom:1px solid var(--div);
       margin-bottom:4px;word-break:break-all;line-height:1.5}
.frow{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 4px;border-radius:8px;
      font-size:13px;cursor:default;user-select:none}
.frow:hover{background:var(--hover)}
.frow .n{flex:0 0 30px;text-align:right;opacity:.55;font-size:12px}
.frow .m{flex:1;min-width:0}
.frow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .s{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .d{flex:0 0 auto;color:var(--text2);font-size:12px}
/* 碟片分组头（原生 Apple Music 风格 CD{n}） */
.disc{font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:.05em;
      padding:16px 0 6px;border-bottom:1px solid var(--div)}
/* ---------- 标签排序（布局照原生 TagSortBorder：字段钮 + 分类卡墙 / 钻取面板） ---------- */
#tagsortwrap{display:flex;flex-direction:column;min-height:0;gap:14px}
/* 顶栏：分类字段胶囊组 + ＋配置 + 分组浏览（原生 TagSortFieldButtonsPanel，墙和面板都在） */
#tsbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 0 auto}
#tsbar .tsl{font-size:12.5px;color:var(--text2);margin-right:2px}
#tsbar .caps{height:28px;border-radius:14px;font-size:12px;padding:0 13px}
/* ＋ 和分组浏览是小方块/胶囊钮（原生 plus 32×32 / 换字段按钮同款胶囊） */
#tsbar .tssq{width:28px;height:28px;border-radius:14px;border:1px solid var(--pillbr);
             background:var(--pill);color:var(--text2);font-family:var(--font);font-size:14px;
             line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#tsbar .tssq:hover{background:var(--hover)}
#tsbar .tsgo{margin-left:auto}
/* 分类墙溢出条（原生 TagSortClassWallOverflowBar） */
#tsmore{flex:0 0 auto;font-size:12px;color:var(--text2);line-height:1.7;
        background:var(--pill);border:1px solid var(--pillbr);border-radius:10px;padding:10px 14px}
#tsmore .tsmbtn{margin-top:8px}
/* 钻取面板：顶行（返回 + 标题 + 播放）+ 视角胶囊 + 内容区 */
#tspanel{display:flex;flex-direction:column;min-height:0;gap:12px;flex:1}
#tspTop{display:flex;align-items:center;gap:10px;flex:0 0 auto}
#tspTop .tsback{height:30px;border-radius:var(--r-ctrl);border:1px solid var(--div2);
                background:transparent;color:var(--text);font-family:var(--font);font-size:12.5px;
                padding:0 12px 0 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
                flex:0 0 auto}
#tspTop .tsback:hover{background:var(--hover)}
#tspTop .tstitle{font-size:15px;font-weight:600;min-width:0;overflow:hidden;
                 text-overflow:ellipsis;white-space:nowrap;flex:1}
#tspTop .tstitle .tstsub{font-size:12px;color:var(--text2);font-weight:400;margin-left:8px}
#tsmodes{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
#tsmodes .caps{height:28px;border-radius:14px;font-size:12px;padding:0 13px}
/* 曲目视角：# 48px 固定列 + 可见配置列（原生 TagSortColumnHeaderGrid 口径，
   列宽按 C# 推来的权重 w 用 flex-grow 分，天然对齐） */
#tssongs{min-width:0}
#tssongs .tshead{display:flex;align-items:center;gap:10px;padding:0 4px 8px;
                 border-bottom:1px solid var(--div);font-size:11.5px;color:var(--text3);
                 font-weight:600;user-select:none}
#tssongs .tshead .tsn{flex:0 0 48px;text-align:center}
#tssongs .tshead .tsc{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tssongs .tshead .tsc:hover{color:var(--text)}
#tssongs .tshead .tsc.on{color:var(--accent)}
.tsrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;
       border-radius:8px;font-size:13px;cursor:default;user-select:none}
.tsrow:hover{background:var(--hover)}
.tsrow.on{background:var(--sel)}
.tsrow.on:hover{background:var(--sel);filter:brightness(.985)}
.tsrow .tsn{flex:0 0 48px;text-align:center;font-size:12px;color:var(--text3);
            font-variant-numeric:tabular-nums}
.tsrow.on .tsn{color:var(--accent)}
.tsrow .tsc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 排序方式视角（原生 TagSortSortPanel） */
#tssort{max-width:560px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
#tssort .tsdesc{font-size:12.5px;color:var(--text2)}
#tssort .tsrow2{display:flex;gap:6px;flex-wrap:wrap}
#tssort .tsstatus{font-size:12px;color:var(--text2);line-height:1.7}
/* 分组视角（原生 TagSortGroupPanel）：工具行 + 组头/歌曲行 */
#tsgbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
#tsgbar select{height:28px;border-radius:14px;border:1px solid var(--pillbr);background:var(--pill);
               color:var(--text);font-family:var(--font);font-size:12px;padding:0 8px;cursor:pointer}
#tsgbar .tsbtn{height:28px;border-radius:14px;border:1px solid var(--pillbr);background:var(--pill);
               color:var(--text2);font-family:var(--font);font-size:12px;padding:0 12px;cursor:pointer}
#tsgbar .tsbtn:hover{background:var(--hover)}
#tsgrows{min-width:0}
/* 组头：缩进 Depth×22（原生 TagSortGroupIndentStep）+ 浅底胶囊 + chevron + 值 + N 首 */
.tgh{display:flex;align-items:center;gap:8px;min-height:36px;border-radius:10px;
     background:rgba(120,120,128,.14);font-size:13px;cursor:default;user-select:none;
     padding-right:8px}
.tgh:hover{filter:brightness(.97)}
.tgh .chev{flex:0 0 16px;text-align:center;opacity:.55;font-size:10px;line-height:1}
.tgh .gv{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgh .gl{font-size:11px;color:var(--text2);flex:0 0 auto}
.tgh .gn{font-size:11px;color:var(--text2);flex:0 0 auto;font-variant-numeric:tabular-nums}
.tgh .gplay{flex:0 0 auto;margin-left:auto;width:26px;height:26px;border:0;border-radius:13px;
            background:transparent;color:var(--text2);cursor:pointer;font-size:11px;
            display:grid;place-items:center;padding:0;font-family:var(--font)}
.tgh .gplay:hover{background:var(--hover);color:var(--accent)}
/* 组内歌曲行：缩进 (Depth+1)×22 + 标题 + 艺术家 + 时长（原生口径） */
.tgr{display:flex;align-items:center;gap:10px;min-height:38px;border-radius:8px;
     font-size:13px;cursor:default;user-select:none;padding:0 8px 0 0}
.tgr:hover{background:var(--hover)}
.tgr .gt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgr .ga{flex:0 1 40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         font-size:12px;color:var(--text2)}
.tgr .gd{flex:0 0 auto;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
/* 评分面板的星级胶囊行（原生 RatingFilterPanel 口径：未评分 + ★1..★5） */
#ratingbar{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 14px}
.caps{height:28px;border-radius:14px;border:1px solid var(--pillbr);background:var(--pill);
      color:var(--text2);font-family:var(--font);font-size:12px;padding:0 13px;cursor:pointer}
.caps:hover{background:var(--hover)}
.caps.on{background:var(--accent);border-color:transparent;color:var(--accentx);font-weight:600}

/* ---------- 底部播放条 ---------- */
.pb{height:90px;flex:0 0 90px;border-top:1px solid var(--div2);background:var(--tb);
    display:flex;align-items:center;padding:0 20px;gap:16px}
.pbleft{width:250px;flex:0 0 250px;display:flex;align-items:center;gap:12px;min-width:0}
.pbleft .cov{width:56px;height:56px;flex:0 0 56px;border-radius:var(--r-card);overflow:hidden;
             background:linear-gradient(140deg,#C6C6CC,#9A9AA2);display:grid;place-items:center;
             color:#fff;font-size:20px;font-weight:600}
.pbleft .cov img{width:100%;height:100%;object-fit:cover;display:block}
.pbmeta{min-width:0;flex:1}
.pbmeta .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbmeta .s{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;margin-top:2px}
.pbmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrls{display:flex;align-items:center;gap:18px}
.ctrls .c{color:var(--text);opacity:.85;cursor:pointer;display:grid;place-items:center;
          background:transparent;border:0;font-family:var(--font);padding:0;font-size:16px}
.ctrls .c:hover{opacity:1}
.ctrls .c.big{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accentx);
              opacity:1;font-size:13px}
.ctrls .c.big:hover{filter:brightness(.94)}
.prog{display:flex;align-items:center;gap:9px;width:100%;max-width:620px}
.prog .tm{font-size:11px;color:var(--text3);width:36px;font-variant-numeric:tabular-nums;
          font-family:var(--mono)}
.prog .tm.r{text-align:right}
.track{flex:1;height:4px;border-radius:2px;background:var(--div2);cursor:pointer;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);width:0}
.track .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;
             border:2px solid var(--accent);transform:translate(-50%,-50%);opacity:0;
             transition:opacity .12s}
.track:hover .knob{opacity:1}
.pbright{width:150px;flex:0 0 150px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.vol{width:80px;height:4px;border-radius:2px;background:var(--div2);cursor:pointer;position:relative}
.vol .fill{position:absolute;left:0;top:0;bottom:0;background:var(--text3);border-radius:2px;width:70%}
.vol .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;
           border:1.5px solid var(--text3);transform:translate(-50%,-50%);opacity:0;
           transition:opacity .12s}
.vol:hover .knob{opacity:1}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(130,130,140,.45);border-radius:5px;
                          border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <button class="back" id="btnExit">&#8249; 返回原界面</button>
    <div class="tbmid">Apple 风格 · 歌曲浏览（试点）</div>
    <div class="search" id="qwrap">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.4"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" placeholder="在已加载的歌曲里筛选">
    </div>
    <div class="spacer"></div>
    <div class="npTag" id="npTag">未在播放</div>
  </div>

  <div class="body">
    <aside class="sb" id="sbnav"></aside>
    <main>
      <div class="hdr">
        <button class="backgrid" id="btnBackGrid" style="display:none">&#8249; 专辑</button>
        <div style="min-width:0">
          <h1 id="pgTitle">歌曲</h1>
          <div class="sub" id="pgSub">加载中…</div>
        </div>
        <div class="spacer"></div>
        <button class="btn pri" id="btnPlayAll">&#9654; 播放</button>
      </div>
      <div class="view" id="view">
        <!-- 评分面板的星级胶囊行（原生 RatingFilterPanel 口径：未评分 + ★1..★5） -->
        <div id="ratingbar" style="display:none"></div>
        <!-- 专辑详情左栏：大封面 + 质量行 + DSD 提示 + 添加至播放队列（原生左栏口径） -->
        <div id="albmeta" class="dmeta" style="display:none"></div>
        <!-- 艺术家详情左栏：圆形大头像 + 添加至播放队列（原生左栏口径） -->
        <div id="artmeta" style="display:none"></div>
        <!-- 中/右栏曲目段：列表面板与两个详情共用（#rows 存的列表随视图切换） -->
        <div id="listwrap">
          <!-- 艺术家详情的「歌曲」段标题（其余视图隐藏） -->
          <div id="xttrkhead" class="sechead" style="display:none"></div>
          <div class="thead" id="songThead">
            <div class="n" id="songTheadN">#</div><div class="m" id="songTheadT">标题</div>
            <div class="d">时长</div><div class="fav"></div>
          </div>
          <div id="rows"></div>
        </div>
        <!-- 专辑网格（专辑页用；艺术家详情右栏的专辑段用 #xtalbgrid） -->
        <div id="albgrid" class="grid" style="display:none"></div>
        <!-- 艺术家墙：圆形头像卡，与方形专辑卡区分 -->
        <div id="artgrid" class="grid grid-art" style="display:none"></div>
        <!-- 艺术家详情右栏：该艺术家的专辑（小标题 + 网格），曲目段复用 #rows -->
        <div id="xtalbwrap">
          <div id="xtalbhead" class="sechead" style="display:none"></div>
          <div id="xtalbgrid" class="grid" style="display:none"></div>
        </div>
        <!-- 媒体库：左栏文件夹树 + 右栏歌曲（原生 FolderBrowserView 口径） -->
        <div id="folderwrap" style="display:none">
          <div id="foldertree"></div>
          <div id="folderdetail">
            <div id="folderhead" class="fhead">选择文件夹查看歌曲</div>
            <div id="frows"></div>
          </div>
        </div>
        <!-- 标签排序：分类卡墙（#tsbar+#tsgrid+#tsmore）/ 钻取面板（#tspanel，原生 TagSortBorder 口径） -->
        <div id="tagsortwrap" style="display:none">
          <div id="tsbar"></div>
          <div id="tsgrid" class="grid" style="display:none"></div>
          <div id="tsmore" style="display:none"></div>
          <div id="tspanel" style="display:none">
            <div id="tspTop">
              <button class="tsback" id="tsback">&#8249; 返回</button>
              <div class="tstitle" id="tstitle"></div>
              <button class="btn pri" id="tspPlay">&#9654; 播放</button>
            </div>
            <div id="tsmodes"></div>
            <div id="tssongs" style="display:none"></div>
            <div id="tscards" class="grid" style="display:none"></div>
            <div id="tssort" style="display:none"></div>
            <div id="tsgroupv" style="display:none">
              <div id="tsgbar"></div>
              <div id="tsgrows"></div>
            </div>
          </div>
        </div>
        <div id="placeholder" style="display:none"></div>
      </div>
    </main>
  </div>

  <div class="pb">
    <div class="pbleft">
      <div class="cov" id="pbCov"></div>
      <div class="pbmeta">
        <div class="t" id="pbTitle">未在播放</div>
        <div class="s" id="pbSub"></div>
      </div>
    </div>
    <div class="pbmid">
      <div class="ctrls">
        <button class="c" id="btnPrev" title="上一首">&#9198;</button>
        <button class="c big" id="btnPlay" title="播放/暂停">&#9654;</button>
        <button class="c" id="btnNext" title="下一首">&#9197;</button>
      </div>
      <div class="prog">
        <div class="tm" id="tmCur">0:00</div>
        <div class="track" id="track"><div class="fill" id="trackFill"></div><div class="knob" id="trackKnob"></div></div>
        <div class="tm r" id="tmDur">0:00</div>
      </div>
    </div>
    <div class="pbright">
      <div class="vol" id="vol"><div class="fill" id="volFill"></div><div class="knob" id="volKnob"></div></div>
    </div>
  </div>
</div>

<script>
/* ================= 通信 =================
   分工铁律：网页只长样子不做事——所有点击上报意图，C# 执行（音频链路零改动）。
   C# → 网页：data（分类+歌曲）/ data/append（歌曲分块，带 fav；最近播放带 sub 副标题）
              / chips（格式胶囊预热补）
              / albums（专辑网格）/ albumcovers（专辑封面预热补）
              / albumtracks（专辑详情曲目，含 tech/dsd/disc）
              / artists（艺术家墙）/ artistcovers（头像预热补：带 i 按下标、只带 name 按名字）
              / artistdetail（艺术家详情）/ artistavatar（网络头像下载完成，更新详情大头像）
              / now（播放状态，每秒）/ theme / nav
              / folderroots（媒体库根目录列表，空 = 没配置）
              / folderchildren（某目录的下一层，子文件夹+音频文件）
              / foldersongs（某目录的歌曲，行带 path）
              / tagsortcats（标签排序分类墙：fields 字段钮 + cards 分类卡 + total/shown/advice）
              / tagsortpanel（标签排序面板：mode/title/fields + 当前视角的
                 cols+songs（曲目）/ grid（专辑·艺术家）/ sort（排序方式）/ group（分组浏览））
              / tagsortcovers（标签排序卡片封面按批补，ctx=wall/grid，items:[{i,cover}]）
   网页 → C#：ready / nav / album（打开专辑，id=专辑下标）
              / artist（打开艺术家，id=艺术家下标）/ artistback（详情里返回墙）
              / xtalbum（艺术家详情里打开专辑，id=该艺人专辑表下标）
              / play / pause / resume / next / prev / seek / volume / love / exit
              / enqueue（当前列表加入播放队列）/ rating（评分面板星级过滤）
              / folder（展开媒体库目录，path=目录）/ folderplay（播放媒体库文件，path=文件）
              / tagsortfield（切分类字段，key）/ tagsortopen（点分类卡，name）
              / tagsortdrill（专辑/艺术家卡钻取，name+sub）/ tagsortmode（切视角，mode）
              / tagsortback（面板返回分类墙）/ tagsortcol（列头点击排序，key）
              / tagsortplay（播放当前列表）/ tagsortsong（播分类曲目，index）
              / tagsortgroupplay（播整组，path）/ tagsortgroupsong（播组内歌曲，path+group+file）
              / tagsorttoggle（组头展开折叠，path）/ tagsortexpand（全部展开/折叠，on）
              / tagsortgroup（分组预设切换，tag）/ tagsortcustom（开原生配置窗，what）
              / tagsortsort（排序方式预设，preset）/ tagsortorder（排序升/降序，asc）
              / tagsortmore（分类墙加载更多） */
(function(){
  /* ---------- WebView2 宿主对象就绪等待（照搬 album.html 的 whenWv 模式） ----------
     偶发竞态：脚本执行时 window.chrome.webview 可能还没注入完，直接访问抛 TypeError
     会把监听注册和 ready 上报一起带走。没就位就排队，就位后按顺序补执行。 */
  var wvWaiters = [], wvReady = false;
  var pumpWv = function(){
    if (window.chrome && window.chrome.webview){
      wvReady = true;
      var list = wvWaiters; wvWaiters = [];
      for (var i = 0; i < list.length; i++){ try { list[i](); } catch (e) {} }
      return true;
    }
    return false;
  };
  var whenWv = function(fn){
    if (wvReady || pumpWv()) { try { fn(); } catch (e) {} }
    else wvWaiters.push(fn);
  };
  if (!pumpWv()){
    var wvT0 = Date.now();
    var wvTimer = setInterval(function(){
      if (pumpWv() || Date.now() - wvT0 > 10000) clearInterval(wvTimer);
    }, 50);
  }

  /* ---------- 上行：网页 → C#（宿主没就位时先攒着，不丢消息） ---------- */
  var postQueue = [];
  var flushPost = function(){
    while (postQueue.length && window.chrome && window.chrome.webview){
      var m = postQueue.shift();
      try { window.chrome.webview.postMessage(JSON.stringify(m)); } catch (e) {}
    }
  };
  var post = function(msg){ postQueue.push(msg); whenWv(flushPost); };
  /* 封面图加载失败上报：URL 是空的还是图裂了，C# 日志能直接分清 */
  var postCoverErr = function(src){ post({kind:'covererr', src:src}); };
  var applyTheme = function(css){
    var s = document.getElementById('__celeste_theme');
    if (!s){ s = document.createElement('style'); s.id='__celeste_theme'; document.head.appendChild(s); }
    s.textContent = css;
  };
  window.__celesteApplyTheme = applyTheme;

  /* ---------- 状态 ---------- */
  var S = {
    cats: [],        // 全部分类（各个分类都保留，只有 Songs/Albums 有数据）
    songs: [],       // C# 推来的歌曲快照（play 的 index 按这个下标）
    total: 0,        // C# 告知的歌曲总数（分块推送时显示加载进度）
    view: [],        // 当前显示的（筛选后的）下标，元素是 songs 的下标
    cur: -1,         // 正在播放在当前列表里的下标
    playing: false, pos: 0, dur: 0, vol: 0.7,
    page: 'Songs',   // 当前选中的分类
    ratingFilter: -1, // 评分面板的星级过滤：-1=全部已评分（原生默认），0=未评分，1..5
    shown: 0,        // 已渲染到第几行（分批渲染用）
    love: {},        // 收藏态（当前列表下标 -> bool）
    ext: null,       // 正在播的曲子不在列表里时，C# 换曲时带来的曲目信息
    albums: [],      // 专辑网格（C# 推来，封面后台预热按批补）
    albumView: [],   // 筛选后的专辑下标（元素是 albums 的下标）
    album: null,     // 打开的专辑详情 {name,artist,year,n,dur,cover}
    albumTracks: [], // 专辑详情的曲目（开着详情时 play/love 的 index 按这份）
    songByAlbum: {}, // 专辑名 -> 歌曲下标数组。专辑封面按专辑粒度算一次，
                     // 同一专辑的歌共用这张图——3609 首各解一次封面要几百秒，
                     // 云盘曲库下更扛不住。专辑封面到货后靠它回填歌曲行。
    artists: [],      // 艺术家墙（C# 推来，头像后台预热按批补）
    artistView: [],   // 筛选后的艺术家下标（元素是 artists 的下标）
    artist: null,     // 打开的艺术家详情 {name,n,dur,cover}
    artistAlbums: [], // 艺术家详情里的专辑段
    folder: {         // 媒体库（文件夹浏览）：左树右栏， kids 缓存展开状态
      roots: [],      //   根节点 [{name,path,isFolder,depth,kids,open,sel}]
      songs: [],      //   右栏歌曲 [{t,sub,dur,fav,path}]
      songsPath: '',  //   右栏当前显示的文件夹（空=还没选）
      loading: false, //   右栏正在等 C# 枚举（大文件夹读盘慢，先显示加载中）
      selPath: ''     //   左栏选中行（原生 SelectionMode=Single）
    },
    tagsort: {        // 标签排序（原生 TagSortBorder 口径）：墙 + 钻取面板
      mode: 'Wall',   //   Wall=分类墙；Songs/Albums/Artists/Sort/GroupBy=面板视角
      title: '',      //   面板标题（「字段标签：值」）
      fields: [],     //   字段钮 [{key,label,on}]
      cards: [],      //   分类卡 [{name,n,cover}]
      total: 0, shown: 0, advice: '',
      cols: [],       //   曲目视角列 [{key,label,w,on,asc}]
      songs: [],      //   曲目视角行 [{n,cells}]（index 与 tagsortsong 对齐）
      grid: [],       //   专辑/艺术家视角卡 [{name,n,sub,cover}]
      sort: null,     //   排序视角 {presets:[{label,on}],asc,status}
      group: null,    //   分组视角 {presets:[{tag,label,on}],rows:[...]}
      gsel: ''        //   分组预设下拉当前值（防 select 的 change 事件把用户选择冲掉）
    },
    artistTracks: []  // 艺术家详情的曲目（开着时 play/love 的 index 按这份）
  };
  var $ = function(id){ return document.getElementById(id); };
  /* 是否开着任一详情（专辑详情 / 艺术家详情）。这两个视图下 #rows 存的不是
     歌曲快照行，歌曲分批渲染链和 songs 相关重绘都得让开——统一走这个判断，
     别再散落着写 `!S.album`（加第三个视图时必漏）。 */
  function inDetail(){ return !!(S.album || S.artist); }
  /* 列表面板：歌曲 + 我喜欢的音乐/评分/最近播放/播放队列/播放最多共用同一套行样式，
     只有页头标题和空列表文案不同（原生同名分类口径，空文案照原生
     SetPlaylistEmptyHint / ApplyRatingCategory）。 */
  var LIST_META = {
    Songs:        { title: '歌曲',         empty: '歌曲列表还没推过来' },
    Favorites:    { title: '我喜欢的音乐', empty: '暂时没有添加我喜欢的音乐' },
    Ratings:      { title: '评分',         empty: '还没有给任何歌曲评分' },
    Recent:       { title: '最近播放',     empty: '最近没有播放记录' },
    UserPlaylist: { title: '播放队列',     empty: '播放队列是空的' },
    MostPlayed:   { title: '播放最多',     empty: '还没有播放记录' }
  };
  /* 空列表文案：评分面板按当前星级过滤给不同文案（原生口径） */
  function listEmptyText(){
    if (S.songs.length) return '没有匹配的歌曲';
    if (S.total > 0) return '加载中…';
    if (S.page === 'Ratings'){
      if (S.ratingFilter === 0) return '没有未评分的歌曲';
      if (S.ratingFilter > 0) return '没有 ' + S.ratingFilter + ' 星评分的歌曲';
      return '还没有给任何歌曲评分';
    }
    var m = LIST_META[S.page];
    return (m && m.empty) || '歌曲列表还没推过来';
  }
  /* #rows 里是不是歌曲快照行（供 append/pump/ chips 判断能不能动 #rows） */
  function isListPage(){ return !!LIST_META[S.page] && !inDetail(); }
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var mmss = function(s){ s=Math.max(0,Math.floor(s||0)); var m=Math.floor(s/60); return m+':'+('0'+(s%60)).slice(-2); };

  /* ---------- 侧栏（分类清单由 C# 推全，未做的分类点一下显示占位） ---------- */
  var ICONS = {
    Songs:'<path d="M6.2 12.6V3.4l7-1.6v9.2"/><circle cx="4.6" cy="12.6" r="2.1"/><circle cx="11.6" cy="11" r="2.1"/>',
    Albums:'<circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="1.4"/>',
    Artists:'<circle cx="8" cy="5.6" r="3.1"/><path d="M2.4 14c0-3 2.5-4.6 5.6-4.6s5.6 1.6 5.6 4.6"/>',
    AlbumArtists:'<circle cx="5.6" cy="6" r="2.6"/><circle cx="10.8" cy="6.6" r="2.1"/><path d="M1.8 13.6c0-2.4 1.7-3.8 3.8-3.8s3.8 1.4 3.8 3.8"/><path d="M8.4 13.6c0-2 1.2-3.2 2.7-3.2s2.7 1.2 2.7 3.2"/>',

  };
  var GROUPS = { music:'音乐', media:'媒体库', tool:'工具' };
  function renderNav(){

    for (var i = 0; i < S.cats.length; i++){
      var c = S.cats[i];
      if (c.g !== lastG){ lastG = c.g; html += '<div class="sbgrp">' + esc(GROUPS[c.g] || c.g) + '</div>'; }

                       : (c.n ? '<span class="cnt">' + c.n + '</span>' : ''));

           + '</div>';

      els[j].onclick = function(){ post({kind:'nav', id:this.getAttribute('data-id')}); };

  /* ---------- 歌曲列表（分批渲染：3609 首一次进 DOM 会卡首屏） ----------
     C# 侧也按 400 首一块推（一次性发 1MB+ 会把 WebView2 渲染进程压死），
     所以这里 renderRows（全量重画）和 appendRows（只追加新块）分开。
     格式胶囊（编码器/位深·采样率/码率）由 C# 后台预热算好后按 kind=chips 增量补。 */
  var BATCH = 300;
  var pumping = false;   // 分批追加链进行中标志：防止滚动/追加把链跑重
  function songRow(si){
    var t = S.songs[si];
    if (!t) return '';
    var on = (si === S.cur);
    var chips = chipsHtml(t);
    // 收藏态：点过心跳 S.love，没点过用快照自带的 fav（五个面板都要显示实心红心）
    var loved = (si in S.love) ? S.love[si] : !!t.fav;
    // 副标题：最近播放面板带 sub（播放于…·播放…·播完），其余用 艺术家 · 专辑
    var sub = t.sub
      ? esc(t.sub)
      : esc(t.artist || '') + (t.album ? ' · ' + esc(t.album) : '');
    return '<div class="row' + (on ? ' on' : '') + '" data-s="' + si + '" data-n="' + (si + 1) + '">'
         +   '<div class="n">' + (on ? '&#9834;' : (si + 1)) + '</div>'
         +   '<div class="a">' + (t.cover
              ? '<img src="' + t.cover + '" alt="" onerror="postCoverErr(this.src)">'
              : esc((t.title || '?').slice(0, 1))) + '</div>'
         +   '<div class="m">'
         +     '<div class="t">' + esc(t.title) + '</div>'
         +     '<div class="s">' + sub + '</div>'
         +     (chips ? '<div class="chips">' + chips + '</div>' : '')
         +   '</div>'
         +   '<div class="d">' + mmss(t.duration) + '</div>'
         +   '<button class="fav' + (loved ? ' on' : '') + '" data-fav="' + si + '" title="收藏">'
         +     (loved ? '&#10084;' : '&#9825;') + '</button>'
         + '</div>';
  }
  /* 格式胶囊：DSD 徽章（扩展名零成本，先有）+ C# 预热补的三段
     （编码器 / 位深·采样率 / 码率，对齐原生歌曲面板第三行）。 */
  function chipsHtml(t){
    var h = '';
    if (t.dsd) h += '<span class="chip hi">DSD</span>';
    if (t.chips) for (var k = 0; k < t.chips.length; k++)
      h += '<span class="chip">' + esc(t.chips[k]) + '</span>';
    return h;
  }
  function applyFilter(){
    var q = ($('q').value || '').trim().toLowerCase();
    S.view = [];
    S.songByAlbum = {};
    for (var i = 0; i < S.songs.length; i++){
      var t = S.songs[i];
      if (t.album){
        var key = t.album.toLowerCase();
        var arr = S.songByAlbum[key];
        if (!arr) S.songByAlbum[key] = arr = [];
        arr.push(i);
      }
      if (!q) { S.view.push(i); continue; }
      var hay = (t.title + ' ' + (t.artist || '') + ' ' + (t.album || '')).toLowerCase();
      if (hay.indexOf(q) >= 0) S.view.push(i);
    }
  }
  /* 专辑封面到货后回填该专辑下所有歌曲行的封面槽。
     歌曲快照本身不带封面（逐首解封面 3609 首读不动），封面按专辑粒度算一次共用。
     行可能还没渲染（分批渲染中）——只更新已渲染的，没渲染的等 songRow 时读 t.cover。 */
  function fillSongCovers(albumName, cover){
    if (inDetail()) return;   // 详情里 #rows 不是歌曲行，别按歌曲下标去撞
    var arr = S.songByAlbum[String(albumName || '').toLowerCase()];
    if (!arr) return;
    for (var j = 0; j < arr.length; j++){
      var si = arr[j];
      var t = S.songs[si];
      if (!t) continue;
      t.cover = cover;
      var slot = $('rows').querySelector('.row[data-s="' + si + '"] .a');
      if (slot) slot.innerHTML = '<img src="' + cover + '" alt="" onerror="postCoverErr(this.src)">';
    }
  }
  function pump(){
    if (pumping) return;   // 链在跑就别插队，scroll/append 来了都等下一批
    pumping = true;
    var host = $('rows');
    var end = Math.min(S.shown + BATCH, S.view.length);
    var html = '';
    for (var i = S.shown; i < end; i++) html += songRow(S.view[i]);
    if (html) host.insertAdjacentHTML('beforeend', html);
    S.shown = end;
    if (S.shown < S.view.length) setTimeout(function(){ pumping = false; pump(); }, 0);
    else pumping = false;
  }
  function renderRows(){
    applyFilter();
    var host = $('rows');
    host.innerHTML = '';
    S.shown = 0;
    if (!S.view.length){
      host.innerHTML = '<div class="empty">' + listEmptyText() + '</div>';
      return;
    }
    pump();
  }
  /* C# 分块推来新歌时只追加，不清屏（清屏会把已渲染的行全删重来，越推越卡） */
  function appendRows(){
    applyFilter();
    if (S.shown < S.view.length) pump();
  }
  $('view').addEventListener('scroll', function(){
    // 专辑网格/详情里 #rows 存的不是歌曲行，别把歌曲分批渲染链引进来
    if (isListPage() && S.shown < S.view.length) pump();
  });
  function markPlaying(){
    var old = $('rows').querySelector('.row.on');
    if (old){
      old.classList.remove('on');
      var on = old.querySelector('.n');
      // data-n 记着这一行本来的序号（歌曲=行号，专辑详情=音轨号），取消高亮时还原
      if (on) on.innerHTML = old.getAttribute('data-n') || (+old.getAttribute('data-s') + 1);
    }
    if (S.cur < 0) return;
    var el = $('rows').querySelector('.row[data-s="' + S.cur + '"]');
    if (el){
      el.classList.add('on');
      var n = el.querySelector('.n');
      if (n) n.innerHTML = '&#9834;';
    }
  }
  /* 标签排序曲目视角的高亮（#rows 那套不动它——C# 的 now.index 在 Songs 视角
     按分类曲目算，别的视角按歌曲快照算，两张表各亮各的） */
  function markTsPlaying(){
    if (S.page !== 'TagSort' || S.tagsort.mode !== 'Songs') return;
    var old = $('tssongs').querySelector('.tsrow.on');
    if (old){
      old.classList.remove('on');
      var on = old.querySelector('.tsn');
      if (on) on.innerHTML = old.getAttribute('data-n') || (+old.getAttribute('data-i') + 1);
    }
    if (S.cur < 0) return;
    var el = $('tssongs').querySelector('.tsrow[data-i="' + S.cur + '"]');
    if (el){
      el.classList.add('on');
      var n = el.querySelector('.tsn');
      if (n) n.innerHTML = '&#9834;';
    }
  }

  /* ---------- 专辑网格 ---------- */
  function albumCard(a){
    var cov = a.cover
      ? '<img src="' + a.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((a.name || '?').slice(0, 1));
    return '<div class="acard" data-a="' + a.i + '">'
         +   '<div class="cv">' + cov + '</div>'
         +   '<div class="nm">' + esc(a.name) + '</div>'
         +   '<div class="ar">' + esc(a.artist || '') + (a.year ? ' · ' + a.year : '') + '</div>'
         + '</div>';
  }
  function applyAlbumsFilter(){
    var q = ($('q').value || '').trim().toLowerCase();
    S.albumView = [];
    for (var i = 0; i < S.albums.length; i++){
      var a = S.albums[i];
      if (!q) { S.albumView.push(i); continue; }
      var hay = (a.name + ' ' + (a.artist || '')).toLowerCase();
      if (hay.indexOf(q) >= 0) S.albumView.push(i);
    }
  }
  function renderAlbGrid(){
    applyAlbumsFilter();
    var host = $('albgrid');
    if (!S.albums.length){
      host.innerHTML = '<div class="empty"><div class="big">专辑列表还没推过来</div>加载中…</div>';
      return;
    }
    if (!S.albumView.length){
      host.innerHTML = '<div class="empty">没有匹配的专辑</div>';
      return;
    }
    var html = '';
    for (var k = 0; k < S.albumView.length; k++) html += albumCard(S.albums[S.albumView[k]]);
    host.innerHTML = html;
    var els = host.querySelectorAll('.acard');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'album', id:+this.getAttribute('data-a')}); };
    }
  }

  /* ---------- 专辑详情 / 艺术家详情的曲目行 ----------
   两个详情共用这一套行：专辑详情读 S.albumTracks，艺术家详情读 S.artistTracks。
   play/love 的 index 也按当前这份算（albumtracks / artistdetail 消息会带上）。 */
  function detailList(){ return S.album ? S.albumTracks : S.artistTracks; }
  function albumRow(i){
    var t = detailList()[i];
    if (!t) return '';
    var on = (i === S.cur);
    var loved = (i in S.love) ? S.love[i] : !!t.fav;
    var cov = t.cover
      ? '<img src="' + t.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((t.title || '?').slice(0, 1));
    var chips = '';
    if (t.dsd) chips += '<span class="chip hi">DSD</span>';
    if (t.fmt) chips += '<span class="chip">' + esc(t.fmt) + '</span>';
    // 专辑详情显示艺术家；艺术家详情显示专辑（原生两栏口径：标题|专辑|时长）
    var sub = S.album ? (t.artist || '') : (t.album || '');
    return '<div class="row' + (on ? ' on' : '') + '" data-s="' + i + '" data-n="' + (t.n || i + 1) + '">'
         +   '<div class="n">' + (on ? '&#9834;' : (t.n || i + 1)) + '</div>'
         +   '<div class="a">' + cov + '</div>'
         +   '<div class="m">'
         +     '<div class="t">' + esc(t.title) + '</div>'
         +     '<div class="s">' + sub + '</div>'
         +     (chips ? '<div class="chips">' + chips + '</div>' : '')
         +   '</div>'
         +   '<div class="d">' + mmss(t.duration) + '</div>'
         +   '<button class="fav' + (loved ? ' on' : '') + '" data-fav="' + i + '" title="收藏">'
         +     (loved ? '&#10084;' : '&#9825;') + '</button>'
         + '</div>';
  }
  /* ---------- 视图切换 ----------
   视图：歌曲列表 / 五个列表面板 / 专辑网格 / 专辑详情 / 艺术家墙 / 艺术家详情。
   ⚠ 铁律：**只切容器的 display，绝不改 #view 的 innerHTML**（会把 #rows/#albgrid
   一起删掉，之后回列表 $('rows') 已是 null 直接 TypeError）。
   新增视图时走 hideAllViews + 显式打开，别再一处一处手写显隐（漏一处就串页）。
   两个详情页是 .view.cols 多栏布局（照原生：专辑=左栏信息+右栏曲目；
   艺术家=左栏头像+中栏歌曲+右栏专辑），列表面板是单栏。 */
  function hideAllViews(){
    var ids = ['ratingbar','albmeta','artmeta','listwrap','xttrkhead','songThead','rows',
               'albgrid','artgrid','xtalbwrap','xtalbhead','xtalbgrid','placeholder',
               'folderwrap','tagsortwrap'];
    for (var i = 0; i < ids.length; i++) $(ids[i]).style.display = 'none';
    $('view').classList.remove('cols');
    $('listwrap').classList.remove('art');
    $('btnBackGrid').style.display = 'none';
  }
  /* 搜索框显隐：原生只有歌曲/专辑/艺术家/媒体库等页有搜索（UpdateLibrarySearchUi），
     标签排序页没有——进页藏起来，别的页再显出来（showTagSort 传 false）。 */
  function setSearchVisible(on){
    $('qwrap').style.display = on ? '' : 'none';
    if (!on) $('q').value = '';
  }
  function resetDetail(){
    S.album = null; S.albumTracks = [];
    S.artist = null; S.artistAlbums = []; S.artistTracks = [];
    S.love = {}; S.cur = -1;
  }
  /* 列表面板（歌曲 + 我喜欢的音乐/评分/最近播放/播放队列/播放最多）：
     同一套行样式，只换页头与空文案；评分面板多一行星级胶囊。 */
  function showList(){
    resetDetail();
    hideAllViews();
    setSearchVisible(true);
    $('listwrap').style.display = '';
    $('songThead').style.display = '';
    $('songTheadN').textContent = '#';
    $('songTheadT').textContent = '标题';
    $('rows').style.display = '';
    $('q').placeholder = '在已加载的歌曲里筛选';   // 媒体库页会换成「搜索文件名」，这里还原
    if (S.page === 'Ratings'){
      $('ratingbar').style.display = '';
      renderRatingBar();
    }
    $('btnPlayAll').style.visibility = '';
    renderRows();
    paintHeader();
  }
  function showAlbumGrid(){
    resetDetail();
    hideAllViews();
    setSearchVisible(true);
    $('albgrid').style.display = '';
    $('btnPlayAll').style.visibility = 'hidden';
    renderAlbGrid();
    paintHeader();
  }
  /* 专辑详情：左栏大封面 + 质量行 + DSD 提示 + 添加至播放队列（原生左栏口径），
     右栏音轨号|歌曲标题|时长（有碟号时按 CD{n} 分组，原生 BuildAlbumGroupedView 口径）。
     专辑名/艺术家·年份·首数·总时长和播放按钮在页头（网页壳的统一 chrome）。 */
  function showAlbumDetail(){
    hideAllViews();
    setSearchVisible(true);
    $('view').classList.add('cols');
    $('albmeta').style.display = '';
    $('listwrap').style.display = '';
    $('songThead').style.display = '';
    $('songTheadN').textContent = '音轨号';
    $('songTheadT').textContent = '歌曲标题';
    $('rows').style.display = '';
    $('btnBackGrid').style.display = '';
    $('btnBackGrid').innerHTML = '&#8249; 专辑';
    $('btnPlayAll').style.visibility = '';
    var a = S.album || {};
    var cov = a.cover
      ? '<img src="' + a.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((a.name || '?').slice(0, 1));
    var meta = '<div class="bigcov">' + cov + '</div>';
    if (a.tech) meta += '<div class="tech">' + esc(a.tech) + '</div>';
    if (a.dsd) meta += '<div class="dsdhint">该专辑为 DSD 专辑，推荐使用 WASAPI 独占输出，在播放前请检查音量大小</div>';
    meta += '<div class="acts">'
         +  '<button class="btn" id="btnEnqueue">添加至播放队列</button>'
         +  '</div>';
    $('albmeta').innerHTML = meta;
    $('btnEnqueue').onclick = function(){ post({kind:'enqueue'}); };
    renderAlbumRows();
    paintHeader();
  }
  /* 专辑详情右栏曲目：有碟号时按 CD 分组（C# 已按碟号→音轨号→标题排好序） */
  function renderAlbumRows(){
    var list = S.albumTracks;
    var html = '';
    var hasDisc = false;
    for (var i = 0; i < list.length; i++){
      if ((list[i].disc || 0) > 0){ hasDisc = true; break; }
    }
    var lastDisc = null;
    for (var j = 0; j < list.length; j++){
      var t = list[j];
      if (hasDisc){
        var d = (t.disc || 0) > 0 ? t.disc : 0;   // 0=未知碟号，排最后（C# 口径）
        if (d !== lastDisc){
          html += '<div class="disc">' + (d > 0 ? 'CD' + d : 'CD?') + '</div>';
          lastDisc = d;
        }
      }
      html += albumRow(j);
    }
    $('rows').innerHTML = html || '<div class="empty">这张专辑里还没有曲目</div>';
  }
  function showArtistWall(){
    resetDetail();
    hideAllViews();
    setSearchVisible(true);
    $('artgrid').style.display = '';
    $('btnPlayAll').style.visibility = 'hidden';
    renderArtWall();
    paintHeader();
  }
  /* 艺术家详情：左栏圆形大头像 + 添加至播放队列（原生左栏口径），中栏歌曲段
     （原生 430px：歌曲标题|专辑|时长），右栏该艺术家的专辑网格（132px 卡片）。
     名字/首数·总时长和播放按钮在页头。 */
  function showArtistDetail(){
    hideAllViews();
    setSearchVisible(true);
    $('view').classList.add('cols');
    $('artmeta').style.display = '';
    $('listwrap').style.display = '';
    $('listwrap').classList.add('art');
    $('songThead').style.display = '';
    $('songTheadN').textContent = '#';
    $('songTheadT').textContent = '歌曲标题';
    $('rows').style.display = '';
    $('xtalbwrap').style.display = '';
    $('xttrkhead').style.display = '';
    $('btnBackGrid').style.display = '';
    $('btnBackGrid').innerHTML = '&#8249; 艺术家';
    $('btnPlayAll').style.visibility = '';
    var ar = S.artist || {};
    var cov = ar.cover
      ? '<img src="' + ar.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((ar.name || '?').slice(0, 1));
    $('artmeta').innerHTML = '<div class="bigcov">' + cov + '</div>'
      + '<div class="acts"><button class="btn" id="btnEnqueue">添加至播放队列</button></div>';
    $('btnEnqueue').onclick = function(){ post({kind:'enqueue'}); };
    $('xttrkhead').innerHTML = '歌曲<span class="c">' + S.artistTracks.length + ' 首</span>';
    renderArtistAlbums();
    var html = '';
    for (var i = 0; i < S.artistTracks.length; i++) html += albumRow(i);
    $('rows').innerHTML = html || '<div class="empty">这位艺术家还没有曲目</div>';
    paintHeader();
  }

  /* ---------- 媒体库（布局/交互照原生 FolderBrowserView） ----------
     左栏文件夹树：根=设置里的媒体库目录（显示完整路径，原生同口径），点文件夹=
     展开一层（子项由 C# 枚举推来）+ 把该文件夹的歌曲加载到右栏；点文件=直接播。
     右栏：台头完整路径 + 歌曲行（序号/文件名/艺术家·专辑/时长，原生 MediaDetailsList 口径）。
     展开状态本地缓存（kids），折叠/再展开不重复麻烦 C#。 */
  var FOLDER_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">'
    + '<path d="M2 4.6c0-.9.7-1.6 1.6-1.6h2.6l1.4 1.8h4.8c.9 0 1.6.7 1.6 1.6v5.6c0 .9-.7 1.6-1.6 1.6H3.6c-.9 0-1.6-.7-1.6-1.6z"/></svg>';
  var FILE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">'
    + '<path d="M4 2.4h4.2L12 6.2v7.4c0 .6-.5 1.1-1.1 1.1H4.9c-.6 0-1.1-.5-1.1-1.1V3.5c0-.6.5-1.1 1.1-1.1z" opacity=".85"/>'
    + '<path d="M8.2 2.6V6.2H12" fill="none" stroke="var(--win)" stroke-width="1"/></svg>';
  function folderBaseName(p){
    var s = String(p || '').replace(/[\\/]+$/, '');
    var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'));
    return i >= 0 ? s.slice(i + 1) : s;
  }
  function folderNodeHtml(n){
    var chev = n.isFolder
      ? '<span class="chev">' + (n.open ? '&#9662;' : '&#9656;') + '</span>'
      : '<span class="chev"></span>';
    return '<div class="fnode' + (n.depth === 0 ? ' root' : '') + (n.sel ? ' sel' : '') + '"'
         + ' data-p="' + esc(n.path) + '" data-f="' + (n.isFolder ? 1 : 0) + '"'
         + ' style="padding-left:' + (8 + n.depth * 16) + 'px" title="' + esc(n.path) + '">'
         +   chev
         +   '<span class="ic">' + (n.isFolder ? FOLDER_ICON : FILE_ICON) + '</span>'
         +   '<span class="nm">' + esc(n.name) + '</span>'
         + '</div>';
  }
  function folderTreeHtml(nodes, depth){
    var html = '';
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      html += folderNodeHtml(n);
      if (n.isFolder && n.open && n.kids && n.kids.length)
        html += folderTreeHtml(n.kids, depth + 1);
    }
    return html;
  }
  function renderFolderTree(){
    var host = $('foldertree');
    var f = S.folder;
    if (!f.roots.length){
      // 原生 FolderBrowserEmptyHint 文案就一句「请选择文件夹」
      host.innerHTML = '<div class="empty" style="padding:30px 8px;text-align:center">'
        + '<div class="big">请选择文件夹</div></div>';
      return;
    }
    host.innerHTML = folderTreeHtml(f.roots, 0);
  }
  function renderFolderDetail(){
    var f = S.folder;
    $('folderhead').textContent = f.songsPath || '选择文件夹查看歌曲';
    if (!f.songsPath){ $('frows').innerHTML = ''; return; }
    if (f.loading && !f.songs.length){
      $('frows').innerHTML = '<div class="empty" style="padding:30px 0;text-align:center">加载中…</div>';
      return;
    }
    var q = ($('q').value || '').trim().toLowerCase();
    var html = '';
    for (var i = 0; i < f.songs.length; i++){
      var t = f.songs[i];
      if (q && String(t.t || '').toLowerCase().indexOf(q) < 0) continue;
      html += '<div class="frow" data-p="' + esc(t.path) + '">'
           +   '<div class="n">' + (i + 1) + '</div>'
           +   '<div class="m">'
           +     '<div class="t">' + esc(t.t) + '</div>'
           +     '<div class="s">' + esc(t.sub || '') + '</div>'
           +   '</div>'
           +   '<div class="d">' + mmss(t.dur) + '</div>'
           + '</div>';
    }
    $('frows').innerHTML = html || '<div class="empty" style="padding:30px 0;text-align:center">'
      + (q ? '没有匹配的文件' : '无歌曲') + '</div>';
  }
  function folderFind(nodes, path){
    for (var i = 0; i < nodes.length; i++){
      if (nodes[i].path === path) return nodes[i];
      if (nodes[i].kids){
        var hit = folderFind(nodes[i].kids, path);
        if (hit) return hit;
      }
    }
    return null;
  }
  function folderSelect(n){
    var f = S.folder;
    // 选中态只留一个（原生 SelectionMode=Single）
    var old = folderFind(f.roots, f.selPath || '\u0000none');
    if (old) old.sel = false;
    n.sel = true;
    f.selPath = n.path;
  }
  function showFolder(){
    resetDetail();
    hideAllViews();
    setSearchVisible(true);
    $('folderwrap').style.display = '';
    $('btnPlayAll').style.visibility = 'hidden';
    $('q').placeholder = '搜索文件名';   // 原生 Folders 分类的搜索框口径
    // 清掉别的页面留下的筛选词：媒体库的搜索只过滤右栏文件名，带旧词进来会全表过滤空
    $('q').value = '';
    renderFolderTree();
    renderFolderDetail();
    paintHeader();
  }
  /* 左栏树点击：文件夹行=选中+展开+右栏加载歌曲（原生每次点文件夹都重新加载右栏）；
     已展开文件夹的箭头=只收起，右栏保持（原生收起箭头不动右栏）；文件=直接播 */
  $('foldertree').addEventListener('click', function(e){
    var el = e.target.closest('.fnode');
    if (!el) return;
    var path = el.getAttribute('data-p');
    var isFolder = el.getAttribute('data-f') === '1';
    var n = folderFind(S.folder.roots, path);
    if (!n) return;
    if (!isFolder){ post({kind:'folderplay', path:path}); return; }
    if (n.open && e.target.closest('.chev')){
      n.open = false;               // 折叠：本地就够，不麻烦 C#，右栏不动
      renderFolderTree();
      return;
    }
    folderSelect(n);
    n.open = true;
    renderFolderTree();
    // 子项 + 右栏歌曲都让 C# 现枚举（大文件夹读盘期间右栏先显示加载中）
    post({kind:'folder', path:path});
    S.folder.songsPath = path;
    S.folder.songs = [];
    S.folder.loading = true;
    renderFolderDetail();
    paintHeader();
  });
  /* 右栏行点击：播放这个文件（原生双击口径，网页单击） */
  $('frows').addEventListener('click', function(e){
    var row = e.target.closest('.frow');
    if (row) post({kind:'folderplay', path:row.getAttribute('data-p')});
  });

  /* ---------- 标签排序（原生 TagSortBorder 口径） ----------
     墙：字段钮组 + 分类卡（点卡进面板）+ 溢出加载更多；
     面板：曲目（可配置列+列头排序）/ 专辑 / 艺术家 / 排序方式 / 分组浏览五个视角。
     播放语义照原生：曲目行=不换队列（tagsortsong），面板播放全部/整组=换队列，
     组内歌曲=播该末级分组全部从该首开始。配置类弹窗（字段/排序/分组）走原生窗口。 */
  var TS_MODES = [
    { id: 'Songs',   t: '曲目' },
    { id: 'Albums',  t: '专辑' },
    { id: 'Artists', t: '艺术家' },
    { id: 'Sort',    t: '排序方式' },
    { id: 'GroupBy', t: '分组浏览' }
  ];
  function tsCover(c, cls){
    var cv = c.cover
      ? '<img src="' + c.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((c.name || '?').slice(0, 1));
    return '<div class="' + cls + '">' + cv + '</div>';
  }
  /* 字段钮组（墙和面板顶栏都有；＋ 开原生字段配置窗，右侧「分组浏览」从墙上进分组） */
  function renderTagSortBar(){
    var t = S.tagsort;
    var html = '<span class="tsl">分类：</span>';
    for (var i = 0; i < t.fields.length; i++){
      var f = t.fields[i];
      html += '<button class="caps' + (f.on ? ' on' : '') + '" data-k="' + esc(f.key) + '">'
           +  esc(f.label) + '</button>';
    }
    html += '<button class="tssq" id="tsplus" title="配置分类字段">＋</button>'
         +  '<button class="caps tsgo" id="tsgroupbtn">分组浏览</button>';
    $('tsbar').innerHTML = html;
    var els = $('tsbar').querySelectorAll('.caps[data-k]');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'tagsortfield', key:this.getAttribute('data-k')}); };
    }
    $('tsplus').onclick = function(){ post({kind:'tagsortcustom', what:'fields'}); };
    $('tsgroupbtn').onclick = function(){ post({kind:'tagsortmode', mode:'GroupBy'}); };
  }
  function renderTagSortWall(){
    var t = S.tagsort;
    renderTagSortBar();
    $('tspanel').style.display = 'none';
    $('tsmore').style.display = 'none';
    $('tsgrid').style.display = '';
    $('btnPlayAll').style.visibility = 'hidden';   // 墙上没有播放全部（原生同）
    var host = $('tsgrid');
    if (!t.cards.length){
      host.innerHTML = '<div class="empty"><div class="big">'
        + (t.total > 0 ? '分类加载中…' : '曲库里还没有歌曲') + '</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < t.cards.length; i++){
      var c = t.cards[i];
      html += '<div class="acard" data-i="' + i + '" title="' + esc(c.name) + '">'
           +   tsCover(c, 'cv')
           +   '<div class="nm">' + esc(c.name) + '</div>'
           +   '<div class="ar">' + (c.n || 0) + ' 首</div>'
           + '</div>';
    }
    host.innerHTML = html;
    var els = host.querySelectorAll('.acard');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){
        post({kind:'tagsortopen', name:S.tagsort.cards[+this.getAttribute('data-i')].name});
      };
    }
    // 溢出条（原生 UpdateClassWallOverflowBar 口径：基数过高给换字段建议）
    if (t.total > t.shown){
      var left = t.total - t.shown;
      $('tsmore').innerHTML = '<div>' + esc(t.advice || '') + '</div>'
        + '<button class="btn tsmbtn" id="tsmorebtn">'
        + (t.shown + 200 <= t.total ? '再加载 ' + Math.min(200, left) + ' 个' : '加载全部剩余')
        + '</button>';
      $('tsmore').style.display = '';
      $('tsmorebtn').onclick = function(){ post({kind:'tagsortmore'}); };
    }
  }
  function renderTagSortPanel(){
    var t = S.tagsort;
    renderTagSortBar();
    $('tsgrid').style.display = 'none';
    $('tsmore').style.display = 'none';
    $('tspanel').style.display = '';
    $('btnPlayAll').style.visibility = '';
    // 顶行：返回 + 标题 + 播放当前列表
    $('tstitle').textContent = t.title || '';
    $('tspPlay').onclick = function(){ post({kind:'tagsortplay'}); };
    $('tsback').onclick = function(){ post({kind:'tagsortback'}); };
    // 视角胶囊（原生 TagSortViewModeButton 五选项）
    var mh = '';
    for (var i = 0; i < TS_MODES.length; i++){
      var m = TS_MODES[i];
      mh += '<button class="caps' + (t.mode === m.id ? ' on' : '') + '" data-m="' + m.id + '">'
         +  esc(m.t) + '</button>';
    }
    $('tsmodes').innerHTML = mh;
    var els = $('tsmodes').querySelectorAll('.caps');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'tagsortmode', mode:this.getAttribute('data-m')}); };
    }
    // 内容区只显当前视角
    $('tssongs').style.display = 'none';
    $('tscards').style.display = 'none';
    $('tssort').style.display = 'none';
    $('tsgroupv').style.display = 'none';
    if (t.mode === 'Songs') renderTsSongs();
    else if (t.mode === 'Albums' || t.mode === 'Artists') renderTsCards();
    else if (t.mode === 'Sort') renderTsSort();
    else if (t.mode === 'GroupBy') renderTsGroup();
  }
  /* 曲目视角：# 48px 固定列 + 可见配置列（列宽按权重 flex 分，列头点击排序） */
  function renderTsSongs(){
    var t = S.tagsort;
    $('tssongs').style.display = '';
    var head = '<div class="tshead"><div class="tsn">#</div>';
    for (var i = 0; i < t.cols.length; i++){
      var c = t.cols[i];
      head += '<div class="tsc' + (c.on ? ' on' : '') + '" data-k="' + esc(c.key) + '"'
           +  ' style="flex:' + (c.w || 1) + ' 1 0" title="点击排序">' + esc(c.label)
           +  (c.on ? (c.asc ? ' ↑' : ' ↓') : '') + '</div>';
    }
    head += '</div>';
    var rows = '';
    if (!t.songs.length) rows = '<div class="empty">这个分类下没有歌曲</div>';
    for (var j = 0; j < t.songs.length; j++){
      var s = t.songs[j];
      var cells = '';
      for (var k = 0; k < t.cols.length; k++){
        var cc = t.cols[k];
        var v = (s.cells || [])[k];
        cells += '<div class="tsc" style="flex:' + (cc.w || 1) + ' 1 0">'
              +  esc(v == null ? '' : v) + '</div>';
      }
      rows += '<div class="tsrow' + (j === S.cur ? ' on' : '') + '" data-i="' + j + '"'
           +   ' data-n="' + (s.n || j + 1) + '">'
           +   '<div class="tsn">' + (j === S.cur ? '&#9834;' : (s.n || j + 1)) + '</div>'
           +   cells
           + '</div>';
    }
    $('tssongs').innerHTML = head + rows;
    var hs = $('tssongs').querySelectorAll('.tshead .tsc[data-k]');
    for (var a = 0; a < hs.length; a++){
      hs[a].onclick = function(){ post({kind:'tagsortcol', key:this.getAttribute('data-k')}); };
    }
    var rs = $('tssongs').querySelectorAll('.tsrow');
    for (var b = 0; b < rs.length; b++){
      rs[b].onclick = function(){ post({kind:'tagsortsong', index:+this.getAttribute('data-i')}); };
    }
  }
  /* 专辑/艺术家视角：对当前分类曲目分组出卡，点卡钻取到曲目 */
  function renderTsCards(){
    var t = S.tagsort;
    $('tscards').style.display = '';
    var host = $('tscards');
    if (!t.grid.length){
      host.innerHTML = '<div class="empty">这个分类下没有歌曲</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < t.grid.length; i++){
      var c = t.grid[i];
      html += '<div class="acard" data-i="' + i + '" title="' + esc(c.name) + '">'
           +   tsCover(c, 'cv')
           +   '<div class="nm">' + esc(c.name) + '</div>'
           +   '<div class="ar">' + (c.n || 0) + ' 首</div>'
           + '</div>';
    }
    host.innerHTML = html;
    var els = host.querySelectorAll('.acard');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){
        var g = S.tagsort.grid[+this.getAttribute('data-i')];
        post({kind:'tagsortdrill', name:g.name, sub:g.sub});
      };
    }
  }
  /* 排序方式视角：6 预设 + 升/降序 + 自定义排序… + 当前依据（原生 TagSortSortPanel） */
  function renderTsSort(){
    var t = S.tagsort;
    var s = t.sort || {presets:[], asc:true, status:''};
    $('tssort').style.display = '';
    var html = '<div class="tsdesc">排序方式（用于排序曲库/主面板歌曲顺序）</div>'
             + '<div class="tsrow2" id="tspresets">';
    for (var i = 0; i < s.presets.length; i++){
      var p = s.presets[i];
      html += '<button class="caps' + (p.on ? ' on' : '') + '" data-p="' + esc(p.label) + '">'
           +  esc(p.label) + '</button>';
    }
    html += '</div><div class="tsrow2">'
         +  '<button class="caps' + (s.asc ? ' on' : '') + '" id="tsasc">升序</button>'
         +  '<button class="caps' + (!s.asc ? ' on' : '') + '" id="tsdesc2">降序</button>'
         +  '<button class="tsbtn" id="tscustom">自定义排序…</button>'
         + '</div>'
         + '<div class="tsstatus">' + esc(s.status) + '</div>';
    $('tssort').innerHTML = html;
    var els = $('tspresets').querySelectorAll('.caps');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'tagsortsort', preset:this.getAttribute('data-p')}); };
    }
    $('tsasc').onclick = function(){ if (!s.asc) post({kind:'tagsortorder', asc:true}); };
    $('tsdesc2').onclick = function(){ if (s.asc) post({kind:'tagsortorder', asc:false}); };
    $('tscustom').onclick = function(){ post({kind:'tagsortcustom', what:'sort'}); };
  }
  /* 分组视角：预设下拉 + 自定义… + 全部展开/折叠 + 组头/歌曲行（原生 TagSortGroupPanel） */
  function renderTsGroup(){
    var t = S.tagsort;
    var g = t.group || {presets:[], rows:[]};
    $('tsgroupv').style.display = '';
    var sel = '<select id="tsgsel">';
    for (var i = 0; i < g.presets.length; i++){
      var p = g.presets[i];
      sel += '<option value="' + esc(p.tag) + '"' + (p.on ? ' selected' : '') + '>'
          +  esc(p.label) + '</option>';
    }
    sel += '</select>';
    $('tsgbar').innerHTML = sel
      + '<button class="tsbtn" id="tsgcustom">自定义…</button>'
      + '<button class="tsbtn" id="tsgexp">全部展开</button>'
      + '<button class="tsbtn" id="tsgcol">全部折叠</button>';
    $('tsgsel').onchange = function(){ post({kind:'tagsortgroup', tag:this.value}); };
    $('tsgcustom').onclick = function(){ post({kind:'tagsortcustom', what:'group'}); };
    $('tsgexp').onclick = function(){ post({kind:'tagsortexpand', on:true}); };
    $('tsgcol').onclick = function(){ post({kind:'tagsortexpand', on:false}); };
    var rows = '';
    if (!g.rows.length) rows = '<div class="empty">没有可分组的内容</div>';
    for (var j = 0; j < g.rows.length; j++){
      var r = g.rows[j];
      // 缩进：组头 Depth×22、歌曲 (Depth+1)×22（原生 TagSortGroupIndentStep）
      var pad = 'padding-left:' + ((r.depth || 0) * 22) + 'px';
      if (r.h){
        rows += '<div class="tgh" data-path="' + esc(r.path) + '" style="' + pad + '">'
             +   '<div class="chev">' + (r.open ? '▾' : '▸') + '</div>'
             +   '<div class="gv">' + esc(r.value) + '</div>'
             +   '<div class="gl">' + esc(r.label) + '</div>'
             +   '<div class="gn">' + (r.n || 0) + ' 首</div>'
             +   '<button class="gplay" title="播放整组">&#9654;</button>'
             + '</div>';
      } else {
        rows += '<div class="tgr" data-path="' + esc(r.path) + '"'
             +   ' data-file="' + esc(r.file) + '" data-group="' + esc(r.group) + '"'
             +   ' style="' + pad + '">'
             +   '<div class="gt">' + esc(r.title) + '</div>'
             +   '<div class="ga">' + esc(r.artist) + '</div>'
             +   '<div class="gd">' + esc(r.dur) + '</div>'
             + '</div>';
      }
    }
    $('tsgrows').innerHTML = rows;
    var hs = $('tsgrows').querySelectorAll('.tgh');
    for (var a = 0; a < hs.length; a++){
      hs[a].onclick = function(e){
        // 行尾播放钮只播整组，不触发展折（原生 chevron/行点击分开的口径）
        if (e.target.closest('.gplay')){
          post({kind:'tagsortgroupplay', path:this.getAttribute('data-path')});
          return;
        }
        post({kind:'tagsorttoggle', path:this.getAttribute('data-path')});
      };
    }
    var ss = $('tsgrows').querySelectorAll('.tgr');
    for (var b = 0; b < ss.length; b++){
      ss[b].onclick = function(){
        post({kind:'tagsortgroupsong',
              path:this.getAttribute('data-path'),
              group:this.getAttribute('data-group'),
              file:this.getAttribute('data-file')});
      };
    }
  }
  function showTagSort(){
    resetDetail();
    hideAllViews();
    $('tagsortwrap').style.display = '';
    setSearchVisible(false);          // 原生标签排序页没有搜索框
    $('q').value = '';
    if (S.tagsort.mode === 'Wall') renderTagSortWall();
    else renderTagSortPanel();

  /* ---------- 艺术家墙 ---------- */
  function artCard(a){
    var cov = a.cover
      ? '<img src="' + a.cover + '" alt="" onerror="postCoverErr(this.src)">'
      : esc((a.name || '?').slice(0, 1));
    return '<div class="acard art" data-x="' + a.i + '" title="' + esc(a.name) + '">'
         +   '<div class="av">' + cov + '</div>'
         +   '<div class="nm">' + esc(a.name) + '</div>'
         +   '<div class="ct">' + (a.n || 0) + ' 首</div>'
         + '</div>';
  }
  function applyArtistsFilter(){
    var q = ($('q').value || '').trim().toLowerCase();
    S.artistView = [];
    for (var i = 0; i < S.artists.length; i++){
      var a = S.artists[i];
      if (!q) { S.artistView.push(i); continue; }
      if (String(a.name || '').toLowerCase().indexOf(q) >= 0) S.artistView.push(i);
    }
  }
  function renderArtWall(){
    applyArtistsFilter();
    var host = $('artgrid');
    if (!S.artists.length){
      host.innerHTML = '<div class="empty"><div class="big">艺术家列表还没推过来</div>加载中…</div>';
      return;
    }
    if (!S.artistView.length){
      host.innerHTML = '<div class="empty">没有匹配的艺术家</div>';
      return;
    }
    var html = '';
    for (var k = 0; k < S.artistView.length; k++) html += artCard(S.artists[S.artistView[k]]);
    host.innerHTML = html;
    var els = host.querySelectorAll('.acard');
    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'artist', id:+this.getAttribute('data-x')}); };
    }
  }
  /* 艺术家详情里的专辑段：卡片复用专辑卡，点开走 xtalbum 消息（下标对应该艺术家的专辑表） */
  function renderArtistAlbums(){
    var host = $('xtalbgrid');
    var head = $('xtalbhead');
    if (!S.artistAlbums.length){
      host.style.display = 'none';
      head.style.display = 'none';
      return;
    }
    head.style.display = '';
    host.style.display = '';
    head.innerHTML = '该艺术家的专辑<span class="c">' + S.artistAlbums.length + ' 张</span>';

           + '</div>';

    for (var j = 0; j < els.length; j++){
      els[j].onclick = function(){ post({kind:'xtalbum', id:+this.getAttribute('data-ax')}); };
