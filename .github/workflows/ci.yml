name: CI

on:
  push:
    branches: [ main, master, develop ]
    # 打 tag（v*）时额外触发一次：用于把安装包与 SHA256SUMS.txt 自动发布到 Release（见最后一步）
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

# 最后一步需要创建 Release 并上传资产
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore main project
        # -r win-x64 必须显式传给每个工程：命令行给主工程传 RID 不会传播给
        # ProjectReference 引用的 CelesteUpdater，顺带还原它时只生成 net9.0
        # 目标、缺 net9.0/win-x64，Build 步骤带自包含标志时必报 NETSDK1047。
        run: dotnet restore CelesteMusicPlayer/CelesteMusicPlayer.csproj -r win-x64 -p:Platform=x64

      - name: Restore updater project
        # 同上：CelesteUpdater 必须单独、直接带 -r win-x64 还原，保证其 assets 含 RID 目标。
        run: dotnet restore CelesteUpdater/CelesteUpdater.csproj -r win-x64 -p:Platform=x64

      - name: Build main (Release x64 self-contained)
        # 先编译主程序 Release，测试工程通过 HintPath 引用其产物（CelesteMusicPlayer.dll）。
        # 本步骤也验证主程序本身能编译通过。
        run: dotnet build CelesteMusicPlayer/CelesteMusicPlayer.csproj -c Release -p:Platform=x64 -p:CelesteSelfContainedDistribute=true --no-restore

      - name: Run DSP/EQ regression tests
        # 自动验证：EQ 声道隔离（无八度偏移）、多声道各声道均生效、无 DSP 时数值直通。
        # 任意不变量被破坏即判失败，红标提醒。
        run: dotnet test tools/EqRegression/EqRegression.csproj -c Debug -p:Platform=x64

      - name: 安装 NSIS（打包安装包需要）
        # windows-latest 镜像不自带 NSIS（曾误以为自带，实测报"找不到 makensis.exe"）。
        # 运行器预装 Chocolatey，choco 装的 nsis 会进 PATH 并在 Program Files (x86)\NSIS 落地，
        # package-installers.ps1 的 Get-Makensis 两条查找路径都能覆盖。
        run: choco install nsis -y --no-progress

      - name: 打包双安装包（框架依赖 + 自包含）
        # 与本地 tools/package-installers.ps1 完全一致：windows-latest 运行器自带 NSIS 3，
        # 版本号从 csproj 自动读取。产物在 dist/：Setup-<ver>.exe（fd）、Setup-SC-<ver>.exe（sc）、SHA256SUMS.txt
        run: powershell -ExecutionPolicy Bypass -File tools/package-installers.ps1

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/CelesteMusicPlayer-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Release（含 SHA256SUMS.txt）
        # P0-1 闭环的关键一步：
        # 客户端更新时会到 Release 里找 SHA256SUMS.txt 做 SHA-256 比对，
        # 「找不到该文件就静默跳过校验」（UpdateChecker.cs）。
        # 此前 CI 只把文件放进 Actions artifact，没进 Release —— 校验等于空转且没有任何提示。
        # 这里保证：只要发版时打 tag（v*），安装包与哈希清单一定一起进 Release。
        # 用 GitHub 官方预装的 gh CLI，不引入第三方 action。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @()
          $assets += (Get-ChildItem -Path dist -Filter 'CelesteMusicPlayer-Setup-*.exe').FullName
          $assets += (Resolve-Path 'dist/SHA256SUMS.txt').Path
          if (-not $assets -or $assets.Count -lt 2) {
            throw "dist 下缺少安装包或 SHA256SUMS.txt，拒绝发布（当前找到 $($assets.Count) 个文件）"
          }
          Write-Host "将上传 $($assets.Count) 个文件到 Release $tag"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes --title $tag @assets
          } else {
            gh release upload $tag @assets --clobber
          }
